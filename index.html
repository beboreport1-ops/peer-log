<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peer Log Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --obsidian:#09090b;
    --obsidian-2:#0c0c0f;
    --panel:#0f0f13;
    --panel-2:#131318;
    --line:rgba(34,197,94,.10);
    --line-2:rgba(34,197,94,.18);
    --line-strong:rgba(34,197,94,.30);
    --phosphor:#22c55e;
    --phosphor-glow:#4ade80;
    --phosphor-dim:rgba(34,197,94,.60);
    --phosphor-mute:rgba(34,197,94,.40);
    --phosphor-faint:rgba(34,197,94,.20);
    --text:#c7f0d4;
    --text-soft:rgba(199,240,212,.70);
    --dim:rgba(199,240,212,.40);
    --ok:#22c55e;
    --warn:#eab308;
    --danger:#ef4444;
    --danger-border:rgba(239,68,68,.35);
    --danger-border-soft:rgba(239,68,68,.15);
    --danger-subtle:rgba(239,68,68,.06);
    --danger-bg-hover:rgba(239,68,68,.10);
    --danger-bg-focus:rgba(239,68,68,.12);
    --danger-bg-active:rgba(239,68,68,.20);
    --danger-glow:rgba(239,68,68,.25);
    --danger-glow-focus:rgba(239,68,68,.40);
    --danger-inner:rgba(239,68,68,.45);
    --mono:'JetBrains Mono','SFMono-Regular','Fira Code','Consolas',ui-monospace,monospace;
    --motion-fast:100ms;
    --motion-ease:cubic-bezier(.2,.6,.2,1);
    --focus-props:border-color,color,background-color,box-shadow;
  }
  *{box-sizing:border-box;}
  html,body{-webkit-font-smoothing:antialiased;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(34,197,94,.06), transparent 60%),
      radial-gradient(900px 400px at 0% 100%, rgba(34,197,94,.04), transparent 55%),
      var(--obsidian);
    color:var(--text);
    font-family:var(--mono);
    font-size:13px;
    line-height:1.5;
    min-height:100vh;
    padding:24px 16px 100px;
    letter-spacing:.01em;
    position:relative;
  }
  /* scanline overlay */
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 2px,
      rgba(34,197,94,.025) 3px, rgba(34,197,94,.025) 3px
    );
    z-index:1;
    mix-blend-mode:screen;
  }
  /* moving scanline */
  body::after{
    content:"";
    position:fixed;left:0;right:0;height:120px;
    background:linear-gradient(to bottom, transparent, rgba(34,197,94,.04), transparent);
    pointer-events:none;
    animation:scan 8s linear infinite;
    z-index:2;
  }
  @keyframes scan{
    0%{transform:translateY(-120px);}
    100%{transform:translateY(100vh);}
  }
  .wrap{max-width:1000px;margin:0 auto;position:relative;z-index:3;}

  ::selection{background:var(--phosphor);color:var(--obsidian);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:var(--panel);}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);}
  ::-webkit-scrollbar-thumb:hover{background:var(--phosphor-dim);}

  /* ==== header / HUD ==== */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line-2);
    padding:14px 4px 16px;
    margin-bottom:20px;
    gap:16px;
    flex-wrap:wrap;
    position:relative;
  }
  header::before{
    content:"// SESSION";
    position:absolute;
    top:-8px;left:12px;
    background:var(--obsidian);
    padding:0 8px;
    font-size:9px;
    color:var(--phosphor-mute);
    letter-spacing:.2em;
  }
  h1{
    font-size:15px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
    font-weight:600;
    display:flex;
    align-items:center;
    gap:2px;
  }
  h1::before{
    content:">";
    color:var(--phosphor);
    margin-right:8px;
    animation:blink 1.1s step-end infinite;
  }
  h1 span{color:var(--phosphor);text-shadow:0 0 8px rgba(34,197,94,.6);}
  @keyframes blink{50%{opacity:0;}}

  .sub{
    color:var(--dim);
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .dot{
    width:7px;height:7px;border-radius:0;
    background:var(--dim);
    display:inline-block;
    box-shadow:0 0 0 1px currentColor;
    color:var(--dim);
  }
  .dot.synced{
    background:var(--phosphor);
    color:var(--phosphor);
    box-shadow:0 0 0 1px var(--phosphor), 0 0 10px var(--phosphor);
    animation:pulse-glow 2.4s ease-in-out infinite;
  }
  .watch-indicator{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-left:12px;
    font-size:11px;
    color:var(--phosphor);
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .dot.watch-dot{
    background:var(--phosphor);
    color:var(--phosphor);
    box-shadow:0 0 0 1px var(--phosphor), 0 0 10px var(--phosphor);
    animation:pulse-glow 1.4s ease-in-out infinite;
  }
  .health-banner{
    margin:0 0 20px;
    padding:10px 16px;
    border:1px solid var(--warn);
    background:rgba(234,179,8,.08);
    color:var(--warn);
    font-size:12px;
    line-height:1.6;
  }
  .health-banner div{padding:2px 0;}
  .dot.syncing{
    background:var(--warn);color:var(--warn);
    box-shadow:0 0 0 1px var(--warn), 0 0 8px var(--warn);
    animation:pulse-glow 1s ease-in-out infinite;
  }
  .dot.err{background:var(--danger);color:var(--danger);box-shadow:0 0 0 1px var(--danger),0 0 8px var(--danger);}
  .dot.warn{background:var(--warn);color:var(--warn);box-shadow:0 0 0 1px var(--warn),0 0 8px var(--warn);}
  @keyframes pulse-glow{
    0%,100%{opacity:1;}
    50%{opacity:.45;}
  }

  .role-tag{
    font-size:9.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:2px 8px;
    border-radius:0;
    border:1px solid var(--line-2);
    color:var(--phosphor-mute);
    font-weight:500;
    background:rgba(34,197,94,.04);
  }
  .role-tag::before{content:"[ ";opacity:.6;}
  .role-tag::after{content:" ]";opacity:.6;}
  .role-tag.admin{color:var(--warn);border-color:rgba(234,179,8,.4);background:rgba(234,179,8,.06);}
  .role-tag:empty{display:none;}

  .logout-link{
    background:none;border:1px solid transparent;
    color:var(--dim);
    font-family:var(--mono);font-size:10px;
    text-decoration:none;
    cursor:pointer;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:2px 6px;
  }
  .logout-link::before{content:"[ ";}
  .logout-link::after{content:" ]";}
  .logout-link:hover{color:var(--phosphor);border-color:var(--line-2);background:rgba(34,197,94,.06);}

  .count{
    font-size:10px;
    color:var(--phosphor-mute);
    letter-spacing:.15em;
    text-transform:uppercase;
    text-align:right;
    border:1px solid var(--line-2);
    padding:8px 14px;
    background:rgba(34,197,94,.04);
    position:relative;
  }
  .count::before{
    content:"PEERS";
    position:absolute;top:-7px;right:10px;
    background:var(--obsidian);
    padding:0 6px;
    font-size:8px;
    color:var(--phosphor-mute);
    letter-spacing:.2em;
  }
  .count b{
    color:var(--phosphor);
    font-size:20px;
    display:block;
    font-weight:600;
    letter-spacing:.05em;
    line-height:1;
    text-shadow:0 0 8px rgba(34,197,94,.5);
    margin-bottom:2px;
  }

  /* ==== dropzone ==== */
  .dropzone{
    border:1px dashed var(--line-strong);
    background:
      repeating-linear-gradient(45deg, transparent 0 8px, rgba(34,197,94,.02) 8px 9px),
      var(--panel);
    border-radius:0;
    padding:32px 20px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s, box-shadow .15s;
    margin-bottom:20px;
    display:block;
    position:relative;
  }
  .dropzone::before{
    content:"// INGEST";
    position:absolute;top:-8px;left:14px;
    background:var(--obsidian);
    padding:0 8px;
    font-size:9px;
    color:var(--phosphor-mute);
    letter-spacing:.2em;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--phosphor);
    background:rgba(34,197,94,.05);
    box-shadow:inset 0 0 30px rgba(34,197,94,.06);
  }
  .dropzone p{margin:0;color:var(--dim);font-size:11px;letter-spacing:.03em;line-height:1.6;}
  .dropzone p.main{color:var(--text);font-size:12.5px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em;}
  .dropzone .accent{color:var(--phosphor);text-shadow:0 0 6px rgba(34,197,94,.4);}
  input[type=file]{display:none;}

  /* ==== toolbar ==== */
  .toolbar{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .search{
    flex:1;
    min-width:200px;
    background:var(--panel);
    border:1px solid var(--line-2);
    color:var(--phosphor);
    padding:10px 14px 10px 28px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.05em;
    text-transform:uppercase;
    border-radius:0;
    outline:none;
    transition:var(--focus-props) var(--motion-fast) var(--motion-ease);
    background-image:linear-gradient(to right, transparent 12px, transparent);
    position:relative;
  }
  /* $ prompt on the search input, via wrapper trick using background */
  .toolbar{position:relative;}
  .search{
    background-image:
      radial-gradient(circle at 12px 50%, var(--phosphor) 1.5px, transparent 2px),
      none;
  }
  .search:hover{border-color:var(--phosphor-dim);}
  .search:focus,
  .search:focus-visible{
    border-color:var(--phosphor);
    box-shadow:0 0 0 1px var(--phosphor), 0 0 12px rgba(34,197,94,.25), inset 0 0 20px rgba(34,197,94,.05);
  }
  .search:not(:placeholder-shown){border-color:var(--phosphor-dim);color:var(--phosphor);}
  .search::placeholder{color:var(--phosphor-faint);text-transform:uppercase;letter-spacing:.1em;}

  /* ==== buttons ==== */
  .btn{
    background:var(--panel);
    border:1px solid var(--line-2);
    color:var(--phosphor-dim);
    padding:9px 18px;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    border-radius:0;
    cursor:pointer;
    transition:var(--focus-props) var(--motion-fast) var(--motion-ease);
    white-space:nowrap;
    position:relative;
    font-weight:500;
  }
  .btn::before{content:"[ ";color:var(--phosphor-mute);}
  .btn::after{content:" ]";color:var(--phosphor-mute);}
  .btn:hover{
    border-color:var(--phosphor);
    color:var(--phosphor);
    background:rgba(34,197,94,.08);
    box-shadow:0 0 0 1px var(--phosphor), 0 0 12px rgba(34,197,94,.2);
  }
  .btn:hover::before,.btn:hover::after{color:var(--phosphor);}
  .btn:focus{outline:none;}
  .btn:focus-visible{
    outline:none;
    border-color:var(--phosphor);
    color:var(--phosphor);
    background:rgba(34,197,94,.1);
    box-shadow:0 0 0 1px var(--phosphor), 0 0 12px rgba(34,197,94,.35), inset 0 0 0 1px rgba(34,197,94,.15);
  }
  .btn:focus-visible::before,.btn:focus-visible::after{color:var(--phosphor);}
  .btn:active,
  .btn.is-active{
    transform:translateY(1px);
    background:rgba(34,197,94,.18);
    border-color:var(--phosphor);
    color:var(--phosphor);
    box-shadow:inset 0 0 0 1px rgba(34,197,94,.35), inset 0 1px 0 rgba(0,0,0,.35);
  }
  .btn.primary{
    color:var(--obsidian);
    background:var(--phosphor);
    border-color:var(--phosphor);
    font-weight:600;
    box-shadow:0 0 12px rgba(34,197,94,.35);
  }
  .btn.primary::before,.btn.primary::after{color:var(--obsidian);opacity:.5;}
  .btn.primary:hover{
    background:var(--phosphor-glow);
    border-color:var(--phosphor-glow);
    color:var(--obsidian);
    box-shadow:0 0 20px rgba(34,197,94,.6);
  }
  .btn.primary:focus-visible{
    background:var(--phosphor-glow);
    border-color:var(--phosphor-glow);
    color:var(--obsidian);
    box-shadow:0 0 0 2px var(--obsidian), 0 0 0 3px var(--phosphor), 0 0 18px rgba(34,197,94,.55);
  }
  .btn.primary:active,
  .btn.primary.is-active{
    transform:translateY(1px);
    background:var(--phosphor);
    border-color:var(--phosphor);
    color:var(--obsidian);
    box-shadow:inset 0 1px 0 rgba(0,0,0,.35), 0 0 10px rgba(34,197,94,.4);
  }
  .btn.danger{
    color:var(--danger);
    border-color:var(--danger-border);
  }
  .btn.danger::before,.btn.danger::after{color:var(--danger);opacity:1;}
  .btn.danger:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-bg-hover);box-shadow:0 0 0 1px var(--danger),0 0 10px var(--danger-glow);}
  .btn.danger:hover::before,.btn.danger:hover::after{color:var(--danger);}
  .btn.danger:focus-visible{
    color:var(--danger);
    border-color:var(--danger);
    background:var(--danger-bg-focus);
    box-shadow:0 0 0 1px var(--danger), 0 0 12px var(--danger-glow-focus), inset 0 0 0 1px var(--danger-bg-focus);
  }
  .btn.danger:focus-visible::before,.btn.danger:focus-visible::after{color:var(--danger);}
  .btn.danger:active,
  .btn.danger.is-active{
    color:var(--danger);
    border-color:var(--danger);
    background:var(--danger-bg-active);
    box-shadow:inset 0 0 0 1px var(--danger-inner), inset 0 1px 0 rgba(0,0,0,.35);
  }
  .btn.danger:active::before,.btn.danger.is-active::before,
  .btn.danger:active::after,.btn.danger.is-active::after{color:var(--danger);}
  .btn.danger:disabled,
  .btn.danger:disabled:hover,
  .btn.danger:disabled:focus-visible{
    color:var(--danger);
    border-color:var(--danger-border);
    background:var(--panel);
    box-shadow:none;
    opacity:.4;
  }
  .btn.danger:disabled::before,.btn.danger:disabled::after{color:var(--danger);}
  .btn.warn:hover{color:var(--warn);border-color:var(--warn);background:rgba(234,179,8,.08);box-shadow:0 0 0 1px var(--warn),0 0 10px rgba(234,179,8,.25);}
  .btn.warn:hover::before,.btn.warn:hover::after{color:var(--warn);}
  .btn.warn:focus-visible{
    color:var(--warn);
    border-color:var(--warn);
    background:rgba(234,179,8,.12);
    box-shadow:0 0 0 1px var(--warn), 0 0 12px rgba(234,179,8,.35), inset 0 0 0 1px rgba(234,179,8,.18);
  }
  .btn.warn:focus-visible::before,.btn.warn:focus-visible::after{color:var(--warn);}
  .btn.warn:active,
  .btn.warn.is-active{
    color:var(--warn);
    border-color:var(--warn);
    background:rgba(234,179,8,.2);
    box-shadow:inset 0 0 0 1px rgba(234,179,8,.4), inset 0 1px 0 rgba(0,0,0,.35);
  }
  .btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none;}
  .btn:disabled:hover{border-color:var(--line-2);color:var(--phosphor-dim);background:var(--panel);}
  .btn:disabled:focus-visible{box-shadow:none;background:var(--panel);border-color:var(--line-2);color:var(--phosphor-dim);}
  @media (prefers-reduced-motion: reduce){
    .btn{transition:none;}
    .btn:active,.btn.is-active{transform:none;}
  }

  /* ==== bulk bar ==== */
  .bulk-bar{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 16px;
    padding:10px 14px;
    background:var(--panel);
    border:1px solid var(--phosphor);
    border-radius:0;
    flex-wrap:wrap;
    box-shadow:0 0 0 1px rgba(34,197,94,.15), 0 0 24px rgba(34,197,94,.15), inset 0 0 0 1px rgba(34,197,94,.08);
    position:relative;
  }
  .bulk-bar::before{
    content:"// BULK_OP";
    position:absolute;top:-8px;left:12px;
    background:var(--obsidian);
    padding:0 8px;
    font-size:9px;
    color:var(--phosphor);
    letter-spacing:.2em;
  }
  .bulk-bar .count{
    color:var(--obsidian);
    background:var(--phosphor);
    padding:4px 12px;
    border:1px solid var(--phosphor);
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-right:auto;
    font-weight:700;
    text-shadow:none;
    box-shadow:0 0 0 1px rgba(34,197,94,.15), 0 0 12px rgba(34,197,94,.4);
    transition:var(--focus-props) var(--motion-fast) var(--motion-ease);
    position:relative;
  }
  .bulk-bar .count::before{display:none;}
  .bulk-bar .count b{display:inline;font-size:inherit;font-weight:700;color:var(--obsidian);text-shadow:none;margin:0;}
  .bulk-bar .count:focus-visible{
    outline:none;
    border-color:var(--phosphor-glow);
    background:var(--phosphor-glow);
    color:var(--obsidian);
    box-shadow:0 0 0 2px var(--obsidian), 0 0 0 3px var(--phosphor), 0 0 18px rgba(34,197,94,.55);
  }
  .bulk-bar .count:active,
  .bulk-bar .count.is-active{
    transform:translateY(1px);
    background:var(--phosphor);
    border-color:var(--phosphor);
    color:var(--obsidian);
    box-shadow:inset 0 1px 0 rgba(0,0,0,.35), 0 0 10px rgba(34,197,94,.4);
  }
  .bulk-bar .btn:focus-visible{z-index:1;}

  .checkbox-col{width:32px;}
  .star-btn-col{display:none;}
  .row-check{
    width:14px;height:14px;
    cursor:pointer;
    accent-color:var(--phosphor);
    vertical-align:middle;
    appearance:none;
    -webkit-appearance:none;
    border:1px solid var(--line-strong);
    background:var(--obsidian);
    display:inline-block;
    position:relative;
    border-radius:0;
    transition:var(--focus-props) var(--motion-fast) var(--motion-ease);
  }
  .row-check:hover{border-color:var(--phosphor);}
  .row-check:focus-visible{
    outline:none;
    border-color:var(--phosphor);
    box-shadow:0 0 0 2px var(--obsidian), 0 0 0 3px var(--phosphor), 0 0 8px rgba(34,197,94,.4);
  }
  .row-check:checked{
    background:var(--phosphor);
    border-color:var(--phosphor);
    box-shadow:0 0 8px rgba(34,197,94,.5);
  }
  .row-check:checked:focus-visible{
    box-shadow:0 0 0 2px var(--obsidian), 0 0 0 3px var(--phosphor), 0 0 10px rgba(34,197,94,.6);
  }
  .row-check:checked::after{
    content:"";
    position:absolute;
    inset:3px;
    background:var(--obsidian);
  }
  .row-check:indeterminate{
    background:var(--phosphor);
    border-color:var(--phosphor);
    box-shadow:0 0 8px rgba(34,197,94,.5);
  }
  .row-check:indeterminate:focus-visible{
    box-shadow:0 0 0 2px var(--obsidian), 0 0 0 3px var(--phosphor), 0 0 10px rgba(34,197,94,.6);
  }
  .row-check:indeterminate::after{
    content:"";
    position:absolute;
    top:6px;
    left:3px;
    right:3px;
    height:2px;
    background:var(--obsidian);
  }

  /* ==== block titles ==== */
  section.block{margin-bottom:32px;}
  .block-title{
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--phosphor-mute);
    margin:0 0 10px 2px;
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:500;
  }
  .fav-block{margin-bottom:20px;}
  .fav-star{color:var(--phosphor);}
  .fav-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--phosphor-dim);font-size:12px;font-family:var(--mono);}
  .fav-table thead th{
    text-align:left;
    padding:8px 12px;
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--phosphor-mute);
    border-bottom:1px solid var(--phosphor-dim);
  }
  .fav-table tbody td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
  .fav-table tbody tr:last-child td{border-bottom:none;}
  .fav-row{cursor:pointer;transition:background .1s;}
  .fav-row:hover td{background:rgba(34,197,94,.08);}
  .block-title::before{
    content:"//";
    color:var(--phosphor);
  }
  .block-title .n{
    color:var(--phosphor);
    text-shadow:0 0 6px rgba(34,197,94,.4);
  }

  /* ==== tables ==== */
  table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    border:1px solid var(--line-2);
    border-radius:0;
    overflow:hidden;
    font-size:12px;
    font-family:var(--mono);
  }
  .main-table td:nth-child(2){overflow-wrap:break-word;}
  .main-table thead th:nth-child(3), .main-table tbody td:nth-child(3){padding-left:18px;}
  thead th{
    text-align:left;
    padding:11px 14px;
    color:var(--phosphor-mute);
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    font-size:9.5px;
    border-bottom:1px solid var(--line-2);
    background:rgba(34,197,94,.05);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    transition:var(--focus-props) var(--motion-fast) var(--motion-ease);
  }
  thead th:hover{color:var(--phosphor);background:rgba(34,197,94,.08);}
  thead th.sorted{color:var(--phosphor);text-shadow:0 0 6px rgba(34,197,94,.4);}
  thead th .arrow{opacity:.8;margin-left:4px;font-size:9px;}
  thead th:focus{outline:none;}
  thead th:focus-visible{
    outline:none;
    border-color:var(--phosphor);
    color:var(--phosphor);
    background:rgba(34,197,94,.1);
    box-shadow:0 0 0 1px var(--phosphor), 0 0 10px rgba(34,197,94,.35), inset 0 0 0 1px rgba(34,197,94,.15);
  }
  thead th:active{
    transform:translateY(1px);
    background:rgba(34,197,94,.18);
    border-color:var(--phosphor);
    color:var(--phosphor);
    box-shadow:inset 0 0 0 1px rgba(34,197,94,.35), inset 0 1px 0 rgba(0,0,0,.35);
  }
  tbody td{
    padding:10px 14px;
    border-bottom:1px solid rgba(34,197,94,.06);
    color:var(--text);
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.main-row{cursor:pointer;transition:background .1s;}
  tbody tr.main-row.row-even{background:rgba(34,197,94,.02);}
  tbody tr.main-row.row-odd{background:transparent;}
  tbody tr.main-row:hover{background:rgba(34,197,94,.08);}
  tbody tr.main-row:hover td{color:var(--phosphor-glow);}
  tbody tr.main-row:hover td:nth-child(3){color:var(--phosphor);text-shadow:0 0 6px rgba(34,197,94,.4);}

  .ip{color:var(--phosphor);letter-spacing:.02em;font-variant-numeric:tabular-nums;}
  .last-seen{color:var(--dim);font-size:11px;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em;}
  .isp-col{color:var(--phosphor-mute);font-size:11.5px;}

  .label-input{
    width:100%;
    min-width:70px;
    background:transparent;
    border:1px solid transparent;
    color:var(--text);
    font-family:var(--mono);
    font-size:12px;
    padding:5px 8px;
    border-radius:0;
    outline:none;
    transition:var(--focus-props) var(--motion-fast) var(--motion-ease);
    letter-spacing:.02em;
  }
  .label-input::placeholder{color:var(--phosphor-faint);}
  .label-input:hover{border-color:var(--line-2);background:rgba(34,197,94,.04);}
  .label-input:focus,
  .label-input:focus-visible{
    outline:none;
    border-color:var(--phosphor);
    background:var(--obsidian);
    box-shadow:0 0 0 1px var(--phosphor), 0 0 8px rgba(34,197,94,.2), inset 0 0 0 1px rgba(34,197,94,.15);
  }
  .label-input:not(:placeholder-shown){border-color:var(--line-2);}
  .label-static{color:var(--dim);font-size:12px;padding:5px 8px;display:block;font-style:italic;}
  .label-static::before{content:"~ ";color:var(--phosphor-faint);}

  .ip-cell{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
  .ip-line{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}

  /* ==== chip buttons — bracketed tokens ==== */
  .chip-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.1em;
    line-height:1;
    text-transform:uppercase;
    color:var(--phosphor-dim);
    background:transparent;
    border:1px solid var(--line-2);
    padding:1px 8px 0;
    height:22px;
    min-width:22px;
    border-radius:0;
    cursor:pointer;
    white-space:nowrap;
    vertical-align:middle;
    transition:var(--focus-props) var(--motion-fast) var(--motion-ease);
    margin-left:6px;
  }
  .chip-btn::before{content:"[";margin-right:2px;color:var(--phosphor-mute);opacity:.7;}
  .chip-btn::after{content:"]";margin-left:2px;color:var(--phosphor-mute);opacity:.7;}
  .ip-cell .chip-btn{margin-left:0;}
  .ip-actions,.uname-actions{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap;white-space:nowrap;}
  .ip-actions{margin-top:0;}
  .uname-actions{margin-left:6px;margin-top:8px;}
  .chip-btn:hover{
    border-color:var(--phosphor);
    color:var(--phosphor);
    background:rgba(34,197,94,.08);
    box-shadow:0 0 8px rgba(34,197,94,.2);
  }
  .chip-btn:hover::before,.chip-btn:hover::after{color:var(--phosphor);opacity:1;}
  .chip-btn:focus{outline:none;}
  .chip-btn:focus-visible{
    outline:none;
    border-color:var(--phosphor);
    color:var(--phosphor);
    background:rgba(34,197,94,.1);
    box-shadow:0 0 0 1px var(--phosphor), 0 0 10px rgba(34,197,94,.35), inset 0 0 0 1px rgba(34,197,94,.15);
  }
  .chip-btn:focus-visible::before,.chip-btn:focus-visible::after{color:var(--phosphor);opacity:1;}
  .chip-btn:active,
  .chip-btn.is-active{
    transform:translateY(1px);
    background:rgba(34,197,94,.18);
    border-color:var(--phosphor);
    color:var(--phosphor);
    box-shadow:inset 0 0 0 1px rgba(34,197,94,.35), inset 0 1px 0 rgba(0,0,0,.35);
  }
  .chip-btn.chip-icon{padding:0;width:22px;font-size:11px;letter-spacing:0;line-height:22px;}
  .chip-btn.chip-icon::before,.chip-btn.chip-icon::after{display:none;}
  .chip-btn.chip-ghost{border-style:dashed;}
  .chip-btn.chip-ghost:hover{border-style:solid;}
  .chip-btn.chip-ghost:focus-visible{border-style:solid;}
  .chip-btn.chip-accent{color:var(--phosphor);border-color:var(--phosphor-dim);background:rgba(34,197,94,.06);}
  .chip-btn.chip-accent:hover{background:rgba(34,197,94,.14);box-shadow:0 0 10px rgba(34,197,94,.3);}
  .chip-btn.chip-warn{color:var(--phosphor-dim);}
  .chip-btn.chip-warn:hover{color:var(--warn);border-color:var(--warn);background:rgba(234,179,8,.1);box-shadow:0 0 8px rgba(234,179,8,.25);}
  .chip-btn.chip-warn:hover::before,.chip-btn.chip-warn:hover::after{color:var(--warn);}
  .chip-btn.chip-warn:focus-visible{
    color:var(--warn);
    border-color:var(--warn);
    background:rgba(234,179,8,.12);
    box-shadow:0 0 0 1px var(--warn), 0 0 10px rgba(234,179,8,.35), inset 0 0 0 1px rgba(234,179,8,.18);
  }
  .chip-btn.chip-warn:focus-visible::before,.chip-btn.chip-warn:focus-visible::after{color:var(--warn);}
  .chip-btn.chip-warn:active,
  .chip-btn.chip-warn.is-active{
    color:var(--warn);
    border-color:var(--warn);
    background:rgba(234,179,8,.2);
    box-shadow:inset 0 0 0 1px rgba(234,179,8,.4), inset 0 1px 0 rgba(0,0,0,.35);
  }
  .chip-btn.chip-danger{color:var(--danger);border-color:var(--danger-border);}
  .chip-btn.chip-danger::before,.chip-btn.chip-danger::after{color:var(--danger);opacity:1;}
  .chip-btn.chip-danger:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-bg-hover);box-shadow:0 0 8px var(--danger-glow);}
  .chip-btn.chip-danger:hover::before,.chip-btn.chip-danger:hover::after{color:var(--danger);}
  .chip-btn.chip-danger:focus-visible{
    color:var(--danger);
    border-color:var(--danger);
    background:var(--danger-bg-focus);
    box-shadow:0 0 0 1px var(--danger), 0 0 10px var(--danger-glow-focus), inset 0 0 0 1px var(--danger-bg-focus);
  }
  .chip-btn.chip-danger:focus-visible::before,.chip-btn.chip-danger:focus-visible::after{color:var(--danger);}
  .chip-btn.chip-danger:active,
  .chip-btn.chip-danger.is-active{
    color:var(--danger);
    border-color:var(--danger);
    background:var(--danger-bg-active);
    box-shadow:inset 0 0 0 1px var(--danger-inner), inset 0 1px 0 rgba(0,0,0,.35);
  }
  .chip-btn.chip-danger:active::before,.chip-btn.chip-danger.is-active::before,
  .chip-btn.chip-danger:active::after,.chip-btn.chip-danger.is-active::after{color:var(--danger);}
  .chip-btn.copied{color:var(--phosphor);border-color:var(--phosphor);background:rgba(34,197,94,.15);box-shadow:0 0 10px rgba(34,197,94,.4);}
  .chip-btn.copied::before,.chip-btn.copied::after{color:var(--phosphor);opacity:1;}
  .chip-btn.chip-alert{
    color:var(--warn);
    border-color:var(--warn);
    background:rgba(234,179,8,.1);
    cursor:help;
    animation:alertPulse 2s ease-in-out infinite;
  }
  .chip-btn.chip-alert::before,.chip-btn.chip-alert::after{color:var(--warn);}
  .chip-btn.chip-alert:hover{background:rgba(234,179,8,.2);box-shadow:0 0 8px rgba(234,179,8,.35);}
  @keyframes alertPulse{0%,100%{opacity:1;}50%{opacity:.65;}}
  .icon-btn:hover{
    border-color:var(--phosphor);
    color:var(--phosphor);
    background:rgba(34,197,94,.08);
    box-shadow:0 0 8px rgba(34,197,94,.2);
  }
  .icon-btn:focus{outline:none;}
  .icon-btn:focus-visible{
    outline:none;
    border-color:var(--phosphor);
    color:var(--phosphor);
    background:rgba(34,197,94,.1);
    box-shadow:0 0 0 1px var(--phosphor), 0 0 10px rgba(34,197,94,.35), inset 0 0 0 1px rgba(34,197,94,.15);
  }
  .icon-btn:active,
  .icon-btn.is-active{
    transform:translateY(1px);
    background:rgba(34,197,94,.18);
    border-color:var(--phosphor);
    color:var(--phosphor);
    box-shadow:inset 0 0 0 1px rgba(34,197,94,.35), inset 0 1px 0 rgba(0,0,0,.35);
  }
  @media (prefers-reduced-motion: reduce){
    .chip-btn,.icon-btn{transition:none;}
    .chip-btn:active,.chip-btn.is-active,.icon-btn:active,.icon-btn.is-active{transform:none;}
    tr.hist-row,.uname-actions,.ip-actions{animation:none;}
  }

  /* ==== expandable rows ==== */
  tr.unlabeled-row{cursor:pointer;}
  tr.unlabeled-row:hover td{background:rgba(34,197,94,.06);}
  .caret{display:inline-block;transition:transform .12s;margin-right:8px;color:var(--phosphor-mute);}
  .caret::before{content:"▸";}
  tr.expanded .caret{transform:rotate(90deg);color:var(--phosphor);text-shadow:0 0 6px var(--phosphor);}

  @keyframes rowFadeIn{
    from{opacity:0;transform:translateY(-4px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes actionsFadeIn{
    from{opacity:0;transform:translateY(-6px);}
    to{opacity:1;transform:translateY(0);}
  }
  tr.hist-row{animation:rowFadeIn .22s ease-out backwards;}
  .uname-actions{animation:actionsFadeIn .18s ease-out;}
  .ip-actions{animation:actionsFadeIn .18s ease-out;}
  tr.main-row td{transition:background .15s ease;}

  tr.hist-row td{
    padding:6px 14px;
    font-size:11px;
    color:var(--phosphor-mute);
    border-bottom:1px solid rgba(34,197,94,.05);
    background:rgba(0,0,0,.35);
  }
  tr.hist-row td:nth-child(3){
    padding-left:38px;
    position:relative;
  }
  tr.hist-row td:nth-child(3)::before{
    content:"└─";
    position:absolute;
    left:20px;
    color:var(--phosphor-faint);
  }
  tr.hist-row.row-even td{background:rgba(0,0,0,.35);}
  tr.hist-row.row-odd td{background:rgba(0,0,0,.5);}
  tr.hist-row td.ip{color:var(--phosphor-dim);}
  tr.hist-row.newest td{color:var(--text);}
  tr.hist-row.newest td.ip{color:var(--phosphor);text-shadow:0 0 6px rgba(34,197,94,.4);}

  /* ---------- linked PSN ID groups (multiple accounts, same person) ---------- */
  tr.main-row.group-header td:nth-child(2){font-weight:600;}
  .badge.group-badge{color:var(--phosphor);}
  .hist-tag{
    font-size:8.5px;
    color:var(--obsidian);
    background:var(--phosphor);
    padding:2px 6px;
    border-radius:0;
    margin-left:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-weight:700;
    box-shadow:0 0 8px rgba(34,197,94,.4);
  }
  .isp-info{
    display:inline-block;
    font-size:10.5px;
    color:var(--phosphor-mute);
    margin-left:8px;
    padding-left:8px;
    border-left:1px solid var(--line-2);
  }

  /* ==== empty state ==== */
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--dim);
    font-size:12px;
    border:1px dashed var(--line-2);
    background:var(--panel);
    border-radius:0;
    text-transform:uppercase;
    letter-spacing:.1em;
  }
  .empty::before{content:"// ";color:var(--phosphor-mute);}
  .empty .accent{color:var(--phosphor);text-shadow:0 0 6px rgba(34,197,94,.4);}

  .unlabeled-note{
    font-size:10.5px;
    color:var(--phosphor-mute);
    margin:0 0 10px 2px;
    line-height:1.6;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .unlabeled-note::before{content:"[ NOTE ] ";color:var(--phosphor);}
  .warn{color:var(--warn);}

  .unlabeled-table tbody tr:nth-child(even) td{background:rgba(34,197,94,.02);}
  .unlabeled-table tbody tr:hover td{background:rgba(34,197,94,.06);}

  /* ==== add-row / other standalone btns ==== */
  #addRowBtn::before{content:"[ + ";}
  #addRowBtn::after{content:" ]";}
  #addRowBtn{color:var(--phosphor-dim);}
  #addRowBtn:hover{color:var(--phosphor);}

  /* ==== toast ==== */
  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(0);
    background:var(--obsidian);
    border:1px solid var(--phosphor);
    color:var(--phosphor);
    padding:10px 20px;
    border-radius:0;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s, transform .15s;
    max-width:80vw;
    text-align:center;
    z-index:200;
    box-shadow:0 0 0 1px var(--phosphor), 0 0 24px rgba(34,197,94,.4);
  }
  .toast::before{content:">> ";color:var(--phosphor-mute);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-8px);}
  .toast.err{border-color:var(--danger);color:var(--danger);box-shadow:0 0 0 1px var(--danger),0 0 24px var(--danger-glow-focus);}
  .toast.err::before{color:var(--danger);opacity:.6;}

  /* ==== chip tooltip ==== */
  .chip-tip{
    position:relative;
    display:inline-flex;
    align-items:center;
    vertical-align:middle;
    margin-left:6px;
  }
  .chip-tip .chip-btn{margin-left:0;}
  .ip-cell .chip-tip{margin-left:0;}
  .chip-tip[data-tooltip]::after{
    content:attr(data-tooltip);
    position:absolute;
    left:50%;
    bottom:calc(100% + 6px);
    transform:translateX(-50%);
    padding:4px 8px;
    background:var(--obsidian);
    color:var(--phosphor);
    border:1px solid var(--phosphor);
    font-family:var(--mono);
    font-size:9px;
    letter-spacing:.12em;
    text-transform:uppercase;
    white-space:nowrap;
    pointer-events:none;
    z-index:201;
    box-shadow:0 0 0 1px rgba(34,197,94,.15), 0 0 16px rgba(34,197,94,.25);
    opacity:0;
    visibility:hidden;
    transition:none;
  }
  .chip-tip[data-tooltip]::before{
    content:"";
    position:absolute;
    left:50%;
    bottom:calc(100% + 1px);
    transform:translateX(-50%);
    border:5px solid transparent;
    border-top-color:var(--phosphor);
    pointer-events:none;
    z-index:202;
    opacity:0;
    visibility:hidden;
    transition:none;
  }
  .chip-tip:hover::after,
  .chip-tip:focus-within::after,
  .chip-tip:hover::before,
  .chip-tip:focus-within::before{
    opacity:1;
    visibility:visible;
  }
  .chip-tip.danger::after{color:var(--danger);border-color:var(--danger);box-shadow:0 0 0 1px var(--danger-border-soft), 0 0 16px var(--danger-glow);}
  .chip-tip.danger::before{border-top-color:var(--danger);}
  .chip-tip.warn::after{color:var(--warn);border-color:var(--warn);box-shadow:0 0 0 1px rgba(234,179,8,.15), 0 0 16px rgba(234,179,8,.25);}
  .chip-tip.warn::before{border-top-color:var(--warn);}


  /* ==== footer ==== */
  footer{
    margin-top:36px;
    text-align:center;
    color:var(--phosphor-faint);
    font-size:9.5px;
    letter-spacing:.3em;
    text-transform:uppercase;
    padding:20px 0;
    border-top:1px solid var(--line);
  }
  footer::before{content:"// ";color:var(--phosphor-mute);}

  /* ==== gate screen ==== */
  .gate-screen{
    min-height:80vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:3;
  }
  .gate-box{
    width:100%;
    max-width:360px;
    text-align:center;
    background:var(--panel);
    padding:32px 28px;
    border:1px solid var(--phosphor);
    border-radius:0;
    box-shadow:0 0 0 1px rgba(34,197,94,.15), 0 0 40px rgba(34,197,94,.15), inset 0 0 30px rgba(34,197,94,.03);
    position:relative;
  }
  .gate-box::before{
    content:"// AUTHENTICATE";
    position:absolute;
    top:-8px;left:14px;
    background:var(--obsidian);
    padding:0 8px;
    font-size:9px;
    color:var(--phosphor);
    letter-spacing:.2em;
  }
  .gate-box::after{
    content:"█";
    position:absolute;
    top:-8px;right:14px;
    background:var(--obsidian);
    padding:0 6px;
    font-size:10px;
    color:var(--phosphor);
    animation:blink 1.1s step-end infinite;
  }
  .gate-title{
    font-size:17px;
    letter-spacing:.18em;
    text-transform:uppercase;
    margin:0 0 8px;
    font-weight:600;
    color:var(--text);
  }
  .gate-title span{color:var(--phosphor);text-shadow:0 0 8px rgba(34,197,94,.6);}
  .gate-sub{
    color:var(--phosphor-mute);
    font-size:10.5px;
    margin:0 0 22px;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .gate-sub::before{content:"> ";color:var(--phosphor);}
  .gate-tabs{
    display:flex;
    border:1px solid var(--line-2);
    border-radius:0;
    overflow:hidden;
    margin-bottom:18px;
  }
  .gate-tab{
    flex:1;
    background:transparent;
    border:none;
    color:var(--phosphor-mute);
    padding:10px 0;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    cursor:pointer;
    transition:var(--focus-props) var(--motion-fast) var(--motion-ease);
    font-weight:500;
  }
  .gate-tab:hover{color:var(--phosphor);background:rgba(34,197,94,.05);}
  .gate-tab.active{color:var(--obsidian);background:var(--phosphor);text-shadow:none;box-shadow:0 0 12px rgba(34,197,94,.35);}
  .gate-input{
    width:100%;
    background:var(--obsidian);
    border:1px solid var(--line-strong);
    color:var(--phosphor);
    padding:12px 14px;
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.15em;
    border-radius:0;
    outline:none;
    margin-bottom:10px;
    transition:var(--focus-props) var(--motion-fast) var(--motion-ease);
    text-align:center;
  }
  .gate-input:hover{border-color:var(--phosphor-dim);}
  .gate-input:focus,
  .gate-input:focus-visible{
    outline:none;
    border-color:var(--phosphor);
    box-shadow:0 0 0 1px var(--phosphor), 0 0 14px rgba(34,197,94,.3), inset 0 0 20px rgba(34,197,94,.06);
  }
  .gate-input::placeholder{color:var(--phosphor-faint);letter-spacing:.2em;}
  .gate-error{color:var(--danger);font-size:10px;margin:0 0 10px;min-height:14px;letter-spacing:.1em;text-transform:uppercase;}
  .gate-error:not(:empty)::before{content:"! ERR: ";}
  .gate-submit{width:100%;padding:12px;letter-spacing:.2em;font-size:11px;}

  /* ==== modal ==== */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.75);
    display:flex;align-items:center;justify-content:center;
    z-index:100;
    padding:20px;
    backdrop-filter:blur(2px);
  }
  .modal-box{
    background:var(--panel);
    border:1px solid var(--phosphor);
    border-radius:0;
    padding:24px;
    width:100%;
    max-width:360px;
    box-shadow:0 0 0 1px rgba(34,197,94,.2), 0 0 40px rgba(34,197,94,.25);
    position:relative;
  }
  .modal-box::before{
    content:"// INPUT";
    position:absolute;
    top:-8px;left:14px;
    background:var(--panel);
    padding:0 8px;
    font-size:9px;
    color:var(--phosphor);
    letter-spacing:.2em;

<script>
// ---- Supabase config (public/publishable key — safe to expose client-side,
// actual access is restricted by RLS policies + the password/key gate below) ----
const SUPABASE_URL = 'https://kimgthhwggzudpdediga.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3vpCzgVNaI1LDQstLz9_dw_Lv8jCRnf';

let rawRows = [];
let users = [];
let unlabeled = [];
let ipToUsers = new Map(); // ip -> Set of usernames sharing that IP (for alt/smurf detection)

function setSyncStatus(state, msg){
  syncDot.className = 'dot ' + state;
  syncLabel.textContent = msg;
}
function isAdmin(){ return role === 'admin'; }

// ---------- offline upload queue ----------
// New CSV rows are queued in localStorage first, then we try to push them to
// Supabase right away. If that fails (no connection), they stay queued and
// get retried automatically when the browser comes back online.
const PENDING_KEY = 'peerlog_pending_uploads';
function getPendingRows(){
  try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); }
  catch(e){ return []; }
}
function setPendingRows(rows){
  try{ localStorage.setItem(PENDING_KEY, JSON.stringify(rows)); }catch(e){ console.error(e); }
}
function updateSyncIndicator(){
  const n = getPendingRows().length;
  if(n > 0){
    setSyncStatus('warn', `${n} row${n>1?'s':''} queued — waiting for connection`);
  } else if(navigator.onLine === false){
    setSyncStatus('warn', 'offline');
  } else {
    setSyncStatus('synced', 'synced');
  }
}
let flushInFlight = false;
async function flushPendingUploads(){
  if(flushInFlight) return;
  const pending = getPendingRows();
  if(!pending.length) return;
  if(navigator.onLine === false){ updateSyncIndicator(); return; }
  flushInFlight = true;
  setSyncStatus('syncing', `syncing ${pending.length} queued row${pending.length>1?'s':''}...`);
  try{
    await insertRows(pending);
    setPendingRows([]);
    await refreshFromCloud();
    showToast(`synced ${pending.length} queued row${pending.length>1?'s':''}`);
  }catch(e){
    console.error(e);
    updateSyncIndicator();
  }
  flushInFlight = false;
}

// ---------- hashing ----------
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str || '');
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

// ---------- Supabase REST helpers ----------
async function sbFetch(path, options={}){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      ...(options.headers||{})
    }
  });
  if(!res.ok){
    const text = await res.text().catch(()=> '');
    throw new Error(text || res.statusText || 'request failed');
  }
  if(res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ---------- generic modal ----------
function openModal({title, fields=[], submitLabel='Confirm', danger=false, onSubmit}){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${title}</h3>
        <div class="modal-fields">
          ${fields.map(f=>{
            if(f.type==='select'){
              return `<label class="modal-label">${f.label}<select class="modal-input" data-field="${f.id}">${(f.options||[]).map(o=>`<option value="${escapeHtml(o.value)}" ${o.value===(f.value||'')?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select></label>`;
            }
            return `<label class="modal-label">${f.label}<input class="modal-input" type="${f.type||'text'}" data-field="${f.id}" value="${f.value?escapeHtml(f.value):''}" autocomplete="off"></label>`;
          }).join('')}
        </div>
        <p class="modal-error"></p>
        <div class="modal-actions">
          <button class="btn modal-cancel">Cancel</button>
          <button class="btn ${danger?'danger':'primary'} modal-submit">${submitLabel}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const errorEl = overlay.querySelector('.modal-error');
    const submitBtn = overlay.querySelector('.modal-submit');
    const cancelBtn = overlay.querySelector('.modal-cancel');
    const inputs = [...overlay.querySelectorAll('.modal-input')];
    if(inputs[0]) setTimeout(()=>{ inputs[0].focus(); if(inputs[0].select) inputs[0].select(); }, 30);

    function close(result){ overlay.remove(); resolve(result); }
    function collect(){
      const vals = {};
      inputs.forEach(inp => vals[inp.dataset.field] = inp.value);
      return vals;
    }
    async function doSubmit(){
      submitBtn.disabled = true;
      const prevLabel = submitBtn.textContent;
      submitBtn.textContent = '...';
      try{
        const result = await onSubmit(collect());
        if(result && result.ok){
          close(true);
          return;
        }
        errorEl.textContent = (result && result.message) || 'Failed';
        errorEl.style.display = 'block';
      }catch(e){
        errorEl.textContent = e.message || 'Error';
        errorEl.style.display = 'block';
      }
      submitBtn.disabled = false;
      submitBtn.textContent = prevLabel;
    }
    cancelBtn.addEventListener('click', ()=>close(false));
    overlay.addEventListener('click', e=>{ if(e.target===overlay) close(false); });
    submitBtn.addEventListener('click', doSubmit);
    inputs.forEach(inp => inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doSubmit(); }));
  });
}
// Admin actions are already gated by the key at login, so admin-only prompts
// are plain confirmations — no repeated credential entry.
function confirmModal({title, submitLabel='Confirm', danger=true, onConfirm}){
  return openModal({
    title, fields:[], submitLabel, danger,
    onSubmit: async () => {
      try{
        await onConfirm();
        return {ok:true};
      }catch(e){
        return {ok:false, message: e.message || 'Action failed — check connection'};
      }
    }
  });
}

// ---------- destructive confirm (delete-only) ----------
// Distinct red-terminal variant so delete actions never blend in with
// benign confirms. Supports Enter=confirm, Esc=cancel.
function deleteConfirmModal({title='Confirm deletion', target='', warn='This action is permanent and cannot be undone.', submitLabel='Delete', onConfirm}){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const targetHtml = target ? `<span class="modal-target">TARGET &rsaquo; <b>${escapeHtml(target)}</b></span>` : '';
    overlay.innerHTML = `
      <div class="modal-box modal-danger" role="alertdialog" aria-modal="true">
        <h3>${escapeHtml(title)}</h3>
        <div class="modal-warn">
          <div>
            ${escapeHtml(warn)}
            ${targetHtml}
          </div>
        </div>
        <p class="modal-hint"><kbd>ENTER</kbd> confirm &nbsp; <kbd>ESC</kbd> cancel</p>
        <p class="modal-error"></p>
        <div class="modal-actions">
          <button class="btn modal-cancel">Cancel</button>
          <button class="btn danger modal-submit">${escapeHtml(submitLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const errorEl = overlay.querySelector('.modal-error');
    const submitBtn = overlay.querySelector('.modal-submit');
    const cancelBtn = overlay.querySelector('.modal-cancel');
    setTimeout(()=>submitBtn.focus(), 30);

    function close(result){
      document.removeEventListener('keydown', onKey);
      overlay.remove();
      resolve(result);
    }
    async function doSubmit(){
      submitBtn.disabled = true;
      cancelBtn.disabled = true;
      const prev = submitBtn.textContent;
      submitBtn.textContent = '...';
      try{
        await onConfirm();
        close(true);
        return;
      }catch(e){
        errorEl.textContent = (e && e.message) || 'Delete failed — check connection';
        errorEl.style.display = 'block';
      }
      submitBtn.disabled = false;
      cancelBtn.disabled = false;
      submitBtn.textContent = prev;
    }
    function onKey(e){
      if(e.key === 'Escape'){ e.preventDefault(); close(false); }
      else if(e.key === 'Enter' && !submitBtn.disabled){ e.preventDefault(); doSubmit(); }
    }
    document.addEventListener('keydown', onKey);
    cancelBtn.addEventListener('click', ()=>close(false));
    overlay.addEventListener('click', e=>{ if(e.target===overlay) close(false); });
    submitBtn.addEventListener('click', doSubmit);
  });
}

    passwordHash = row.password_hash;

  }catch(e){
    console.error(e);
    gateScreenEl.innerHTML = `<div class="gate-screen"><div class="gate-box"><p class="gate-error" style="display:block;">Couldn't reach the log. Check your connection and reload the page.</p></div></div>`;
    setSyncStatus('err', 'connection failed');
    return;
  }

  const savedRole = sessionStorage.getItem('peerlog_role');

  if(savedRole === 'view' || savedRole === 'admin'){

function showGate(){
  appEl.style.display = 'none';
  let tab = 'view';

  function draw(){
    gateScreenEl.innerHTML = `
      <div class="gate-screen">
        <div class="gate-box">
          <h1 class="gate-title">PEER<span>_</span>LOG</h1>
          <p class="gate-sub">${tab==='view' ? 'Enter your viewer ID' : 'Enter key for admin access'}</p>
          <div class="gate-tabs">
            <button class="gate-tab ${tab==='view'?'active':''}" data-tab="view">Viewer</button>
            <button class="gate-tab ${tab==='admin'?'active':''}" data-tab="admin">Admin</button>
          </div>
          <input class="gate-input" id="gateInput" type="password" placeholder="${tab==='view'?'your ID':'key'}" autocomplete="off">
          <p class="gate-error" id="gateError"></p>
          <button class="btn primary gate-submit" id="gateSubmit">${tab==='view'?'Unlock':'Log in as admin'}</button>
        </div>
      </div>`;

    gateScreenEl.querySelectorAll('.gate-tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        tab = btn.dataset.tab;
        draw();
      });
    });

    const input = document.getElementById('gateInput');
    const err = document.getElementById('gateError');
    const submit = document.getElementById('gateSubmit');
    setTimeout(()=>input.focus(), 30);

    async function tryLogin(){
      submit.disabled = true;
      if(tab === 'admin'){
        const hash = await sha256Hex(input.value);
        if(hash === keyHash){
          role = 'admin';
          viewerId = '__admin__';
          sessionStorage.setItem('peerlog_role', role);
          sessionStorage.setItem('peerlog_viewer_id', viewerId);
          gateScreenEl.innerHTML = '';
          showApp();
        } else {
          err.textContent = 'Incorrect key';
          submit.disabled = false;
        }
        return;
      }
      const entered = input.value.trim();
      if(!entered){
        err.textContent = 'Enter your ID';
        submit.disabled = false;
        return;
      }
      try{
        const rows = await sbFetch(`peer_viewers?select=viewer_id,expires_at&viewer_id=eq.${encodeURIComponent(entered)}`);
        if(rows && rows.length){
          const row = rows[0];
          if(row.expires_at && new Date(row.expires_at) < new Date()){
            err.textContent = 'This ID has expired — ask an admin for a new one';
            submit.disabled = false;
            return;
          }
          role = 'view';
          viewerId = entered;
          sessionStorage.setItem('peerlog_role', role);
          sessionStorage.setItem('peerlog_viewer_id', viewerId);
          gateScreenEl.innerHTML = '';
          touchViewerLastSeen(entered);
          showApp();
        } else {
          err.textContent = 'Incorrect ID';
          submit.disabled = false;
        }
      }catch(e){
        err.textContent = 'Connection error — try again';
        submit.disabled = false;
      }
    }
    submit.addEventListener('click', tryLogin);
    input.addEventListener('keydown', e => { if(e.key==='Enter') tryLogin(); });
  }
  draw();
}

function showHealthBanner(issues){
  if(!healthBanner) return;
  if(!issues.length){
    healthBanner.style.display = 'none';
    healthBanner.innerHTML = '';
    return;
  }
  healthBanner.innerHTML = issues.map(i => `<div>⚠ ${escapeHtml(i)}</div>`).join('');
  healthBanner.style.display = 'block';
}

async function runHealthCheck(){
  const issues = [];

  if(syncDot && syncDot.classList.contains('err')){
    issues.push('Database connection issue — some data may be stale or fail to save until this recovers.');
  }

  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);
    const res = await fetch('https://ipwho.is/1.1.1.1', {signal: controller.signal});
    clearTimeout(timeoutId);
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    if(!data || data.success === false) throw new Error('lookup failed');
  }catch(e){
    issues.push('Geolocation API appears to be down — new IP locations may not resolve until it recovers.');
  }

  showHealthBanner(issues);
}

function normKey(k){
  const s = k.trim().toLowerCase();
  if(s.includes('user') || s.includes('player') || s.includes('name') || s.includes('gamertag') || s.includes('tag')) return 'username';
  if(s.includes('ip')) return 'ip';
  if(s.includes('city')) return 'city';
  if(s.includes('country')) return 'country';
  if(s.includes('loc')) return 'location';
  return s;
}

function parseFile(file){
  return new Promise(resolve=>{
    Papa.parse(file, {
      header:true,
      skipEmptyLines:true,
      complete: res => {
        const fieldMap = {};
        res.meta.fields.forEach(f => fieldMap[f] = normKey(f));
        let skippedJunk = 0, skippedCity = 0;
        const rows = [];
        res.data.forEach(r => {
          const out = {username:'', ip:'', location:'', city:'', country:''};
          Object.keys(r).forEach(k=>{
            const nk = fieldMap[k];
            const val = (r[k]||'').toString().trim();
            if(nk === 'username' || nk === 'ip' || nk === 'location' || nk === 'city' || nk === 'country'){
              out[nk] = val;
            }
          });
          // Some exports (party-chat) give one combined "location" column.
          // Others (traffic export) give separate City/Country columns —
          // stitch those into the same "City, Country" shape either way.
          if(!out.location){
            out.location = (out.city && out.country) ? `${out.city}, ${out.country}` : (out.city || out.country || '');
          }
          delete out.city;
          delete out.country;
          if(!(out.username || out.ip || out.location)){
            skippedJunk++;
            return;
          }
          if(isExcludedCity(out.location)){
            skippedCity++;
            return;
          }
          rows.push(out);
        });
        resolve({rows, skippedJunk, skippedCity});
      },
      error: () => resolve({rows:[], skippedJunk:0, skippedCity:0})
    });
  });
}

// Rows whose city matches one of these are silently skipped during CSV import.

function isExcludedCity(location){

  return EXCLUDED_CITIES.includes(city);

function knownUsernameForIp(ip){

}

// ---------- IP geolocation (replaces CSV/manual location with a live lookup) ----------
const geoCache = new Map(); // ip -> {location, isp} (empty strings if lookup failed/unavailable)

async function fetchGeoInfo(ip){
  if(!ip) return {location:'', isp:''};
  try{
    const res = await fetch(`https://ipwho.is/${encodeURIComponent(ip)}`);
    if(!res.ok) return {location:'', isp:''};
    const data = await res.json();
    if(!data || data.success === false) return {location:'', isp:''};
    const city = data.city || '';
    const country = data.country || '';
    const location = (city && country) ? `${city}, ${country}` : (city || country || '');
    const isp = (data.connection && (data.connection.isp || data.connection.org)) || '';
    return {location, isp};
  }catch(e){
    console.error('geo lookup failed for', ip, e);
    return {location:'', isp:''};
  }
}

async function resolveGeoInfo(ip){
  if(!ip) return {location:'', isp:''};
  if(geoCache.has(ip)) return geoCache.get(ip);
  const info = await fetchGeoInfo(ip);
  geoCache.set(ip, info);
  return info;
}

async function resolveGeoLocation(ip){
  const info = await resolveGeoInfo(ip);
  return info.location;
}

function getIspForIp(ip){
  const c = geoCache.get(ip);
  return c ? c.isp : '';
}

async function resolveGeoLocationsForIps(ips){
  const unique = [...new Set(ips.filter(Boolean))];
  await Promise.all(unique.map(ip => resolveGeoInfo(ip)));
}

  try{

  }catch(e){

    return;
  }
  if(!backup || !Array.isArray(backup.peer_rows)){
    showToast('that file isn\'t a valid Peer Log backup', true);
    return;
  }
  const dateLabel = backup.exportedAt ? new Date(backup.exportedAt).toLocaleString() : 'unknown date';
  await confirmModal({
    title: `Restore backup from ${dateLabel}? This REPLACES all current data (players, labels, hidden IPs, viewer IDs, favorites) — cannot be undone.`,
    submitLabel: 'Restore',
    danger: true,
    onConfirm: async () => {
      showToast('restoring — this may take a moment...');

          sbFetch('peer_rows?id=gt.0', {method:'DELETE'}),
          sbFetch('peer_labels?username_key=neq.__none__', {method:'DELETE'}),
          sbFetch('peer_ip_hidden?ip=neq.__none__', {method:'DELETE'}),

          sbFetch('peer_favorites?viewer_id=neq.__none__', {method:'DELETE'}),
          sbFetch('peer_hidden_for_viewer?viewer_id=neq.__none__', {method:'DELETE'})
        ]);
        const insertIfAny = (table, rows) => (rows && rows.length)
          ? sbFetch(table, {method:'POST', headers:{'Prefer':'return=minimal'}, body: JSON.stringify(rows)})
          : Promise.resolve();
        // peer_rows.id is an auto-generated identity column — drop the old
        // ids from the backup so the database assigns fresh ones.
        const rowsWithoutIds = (backup.peer_rows || []).map(({id, ...rest}) => rest);
        await insertIfAny('peer_rows', rowsWithoutIds);
        await Promise.all([
          insertIfAny('peer_labels', backup.peer_labels),
          insertIfAny('peer_ip_hidden', backup.peer_ip_hidden),
          insertIfAny('peer_viewers', backup.peer_viewers),
          insertIfAny('peer_favorites', backup.peer_favorites),
          insertIfAny('peer_hidden_for_viewer', backup.peer_hidden_for_viewer)
        ]);
        await loadMyFavoritesData();
        await loadHiddenForViewerData();
        await refreshFromCloud();
        showToast('restore complete');
      }catch(e){
        console.error('restore failed', e);
        showToast('restore failed partway through — check connection and your data', true);
      }
    }
  });
}

async function recheckAllLocations(){
  if(!isAdmin()) return;
  const uniqueIps = [...new Set(rawRows.map(r => r.ip).filter(Boolean))];
  if(!uniqueIps.length){
    showToast('no IPs to re-check');
    return;
  }
  await confirmModal({
    title: `Re-check locations for ${uniqueIps.length} unique IP${uniqueIps.length>1?'s':''}? This uses your geolocation API quota and may take a moment.`,
    submitLabel: 'Re-check',
    danger: false,
    onConfirm: async () => {
      setSyncStatus('syncing', `looking up ${uniqueIps.length} IPs...`);
      geoCache.clear(); // force fresh lookups instead of reusing anything cached this session
      await resolveGeoLocationsForIps(uniqueIps);

      let updated = 0, failed = 0;
      await Promise.all(uniqueIps.map(async ip => {
        const info = geoCache.get(ip);
        if(!info || !info.location){ failed++; return; }
        const ids = rawRows.filter(r => r.ip === ip).map(r => r.idx);
        try{
          await updateRowsLocationAndIsp(ids, info.location, info.isp);
          updated++;
        }catch(e){
          console.error('failed to update location for', ip, e);
          failed++;
        }
      }));

      await refreshFromCloud();
      showToast(`updated ${updated} IP${updated>1?'s':''}${failed?`, ${failed} failed`:''}`);
    }
  });
}

function playImportChime(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.4);
  }catch(e){
    console.error('chime failed', e);
  }
}

// ---- remember the chosen folder across visits (IndexedDB — handles can't
// go in localStorage/sessionStorage) so the picker only ever shows up once ----
const WATCH_DB_NAME = 'peerlog-watch';
const WATCH_STORE_NAME = 'handles';
const WATCH_HANDLE_KEY = 'watchDir';

function openWatchDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(WATCH_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(WATCH_STORE_NAME); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveWatchHandle(handle){
  try{
    const db = await openWatchDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(WATCH_STORE_NAME, 'readwrite');
      tx.objectStore(WATCH_STORE_NAME).put(handle, WATCH_HANDLE_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){
    console.error('failed to save watch folder handle', e);
  }
}

async function loadWatchHandle(){
  try{
    const db = await openWatchDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(WATCH_STORE_NAME, 'readonly');
      const req = tx.objectStore(WATCH_STORE_NAME).get(WATCH_HANDLE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){
    console.error('failed to load watch folder handle', e);
    return null;
  }
}

// Records current file states without importing anything — used right after
// starting a watch so only CHANGES from this point on get imported, not
// whatever was already sitting in the folder.
async function establishWatchBaseline(){
  if(!watchDirHandle) return;
  try{
    for await (const [name, handle] of watchDirHandle.entries()){
      if(handle.kind !== 'file') continue;
      if(!name.toLowerCase().endsWith('.csv')) continue;
      const file = await handle.getFile();
      watchFileMTimes.set(name, file.lastModified);
    }
  }catch(e){
    console.error('failed to establish watch baseline', e);
  }
}

async function checkWatchedFolder(){
  if(!watchDirHandle || !isAdmin()) return;
  try{
    const filesToImport = [];
    for await (const [name, handle] of watchDirHandle.entries()){
      if(handle.kind !== 'file') continue;
      if(!name.toLowerCase().endsWith('.csv')) continue;
      const file = await handle.getFile();
      const prevMtime = watchFileMTimes.get(name);
      if(prevMtime === undefined || file.lastModified > prevMtime){
        watchFileMTimes.set(name, file.lastModified);
        filesToImport.push(file);
      }
    }
    if(filesToImport.length){
      await handleFiles(filesToImport);
      notifyWatchImport(filesToImport.map(f=>f.name));
    }
  }catch(e){
    console.error('folder watch check failed', e);
    showToast('lost access to the watched folder — turn watching back on to reselect', true);
    stopFolderWatch();
  }
}

async function startFolderWatch(){
  if(!isFileSystemAccessSupported()){
    showToast("folder watching isn't supported in this browser — use Chrome or Edge", true);
    return;
  }
  if('Notification' in window && Notification.permission === 'default'){
    try{ await Notification.requestPermission(); }catch(e){ /* ignore */ }
  }
  let handle = await loadWatchHandle();
  if(handle){
    try{
      let perm = await handle.queryPermission({mode:'read'});
      if(perm !== 'granted') perm = await handle.requestPermission({mode:'read'});
      if(perm !== 'granted') handle = null;
    }catch(e){
      handle = null;
    }
  }
  if(!handle){
    try{
      handle = await window.showDirectoryPicker();
    }catch(e){
      return; // user cancelled the picker
    }
    await saveWatchHandle(handle);
  }
  watchDirHandle = handle;
  watchFileMTimes = new Map();
  updateWatchButtonUI();
  showToast(`watching "${handle.name}" — will import on the next change`);
  await establishWatchBaseline();
  watchIntervalId = setInterval(checkWatchedFolder, 20000);
}

function stopFolderWatch(){
  if(watchIntervalId){ clearInterval(watchIntervalId); watchIntervalId = null; }
  watchDirHandle = null;
  watchFileMTimes = new Map();
  updateWatchButtonUI();
}

watchFolderBtn.addEventListener('click', () => {
  if(watchDirHandle){
    stopFolderWatch();
    showToast('stopped watching folder');
  } else {
    startFolderWatch();
  }
});

async function handleFiles(files){
  if(!isAdmin()) return;
  setSyncStatus('syncing', 'reading file(s)...');
  const results = await Promise.all(files.map(parseFile));
  const skippedJunk = results.reduce((sum,r)=>sum+r.skippedJunk, 0);
  const skippedCity = results.reduce((sum,r)=>sum+r.skippedCity, 0);
  let autoMatched = 0;
  let parsedRows = results.flatMap(r=>r.rows).map(r => {
    let username = r.username;
    if(!username && r.ip){
      const known = knownUsernameForIp(r.ip);
      if(known){ username = known; autoMatched++; }
    }
    return {username, ip:r.ip, location:r.location};
  });

  if(!parsedRows.length){
    updateSyncIndicator();
    if(skippedJunk || skippedCity) await showImportReport({inserted:[], refreshed:[], autoMatched:0, skippedJunk, skippedCity});
    return;
  }

  // Look up each IP's real location via a geolocation API instead of trusting
  // whatever the CSV (or a manual entry) says — falls back to the CSV's own
  // location only if the lookup fails (offline, rate-limited, private IP, etc).
  setSyncStatus('syncing', 'looking up IP locations...');
  await resolveGeoLocationsForIps(parsedRows.map(r => r.ip));
  parsedRows = parsedRows.map(r => {
    const geo = geoCache.get(r.ip);
    return {...r, location: (geo && geo.location) || r.location, isp: (geo && geo.isp) || ''};
  });
  setSyncStatus('syncing', 'syncing...');

  // De-dupe against what's already in the database: exact same PSN ID + IP +
  // location just gets its Last Seen refreshed instead of adding a new row.
  const existingByKey = new Map(); // "username|ip|location" -> most recent row id
  rawRows.forEach(r => {
    const key = `${(r.username||'').toLowerCase()}|${r.ip}|${r.location}`;
    existingByKey.set(key, r.idx); // ascending order, so last write wins = most recent
  });

  const toInsert = [];
  const touchIds = [];
  const refreshedRows = [];
  parsedRows.forEach(r => {
    const key = `${(r.username||'').toLowerCase()}|${r.ip}|${r.location}`;
    if(existingByKey.has(key)){
      touchIds.push(existingByKey.get(key));
      refreshedRows.push(r);
    } else {
      toInsert.push(r);
    }
  });

  if(touchIds.length){
    try{ await touchRowsTimestamp(touchIds); }catch(e){ console.error(e); }
  }

  if(!toInsert.length){
    await refreshFromCloud();
    await showImportReport({inserted:[], refreshed:refreshedRows, autoMatched, skippedJunk, skippedCity});
    return;
  }

  const pending = getPendingRows();
  pending.push(...toInsert);
  setPendingRows(pending);
  await flushPendingUploads();
  await showImportReport({inserted:toInsert, refreshed:refreshedRows, autoMatched, skippedJunk, skippedCity});
}

function showImportReport({inserted, refreshed, autoMatched, skippedJunk, skippedCity}){
  const ipRow = (r) => `
    <div class="group-ip-row">
      <div class="group-ip-main">
        <span class="ip">${r.ip ? escapeHtml(r.ip) : '—'}</span>
      </div>
      <div class="group-ip-sub">${r.username ? escapeHtml(r.username) : 'no PSN ID'} · ${r.location ? escapeHtml(r.location) : 'no location'}</div>
    </div>`;

  function splitGroup(label, rows){
    if(!rows.length) return '';
    const withPsn = rows.filter(r => r.username);
    const noPsn = rows.filter(r => !r.username);
    let html = `<div class="group-section-label">${label} (${rows.length})</div>`;
    if(withPsn.length){
      html += `<div class="group-section-sublabel">With PSN ID (${withPsn.length})</div>${withPsn.map(ipRow).join('')}`;
    }
    if(noPsn.length){
      html += `<div class="group-section-sublabel">No PSN ID (${noPsn.length})</div>${noPsn.map(ipRow).join('')}`;
    }
    return html;
  }

  const sections = [];
  sections.push(splitGroup('New', inserted));
  sections.push(splitGroup('Refreshed — Last Seen updated', refreshed));
  const tallyBits = [];
  if(autoMatched) tallyBits.push(`${autoMatched} auto-matched to an existing PSN ID`);
  if(skippedCity) tallyBits.push(`${skippedCity} skipped (excluded city)`);
  if(skippedJunk) tallyBits.push(`${skippedJunk} malformed row${skippedJunk===1?'':'s'} ignored`);
  if(tallyBits.length){
    sections.push(`<div class="group-section-label">Also</div><div class="group-ip-sub" style="padding:4px 2px;">${tallyBits.join(' · ')}</div>`);
  }
  if(!sections.join('')){
    sections.push(`<div class="group-ip-empty">Nothing changed</div>`);
  }

  return showInfoModal({title:'Import complete', bodyHtml:`<div class="group-modal-scroll">${sections.join('')}</div>`});
}

function showInfoModal({title, bodyHtml}){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box group-modal-box">
        <h3>${title}</h3>
        <div class="modal-fields">${bodyHtml}</div>
        <div class="modal-actions">
          <button class="btn primary modal-ok">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const okBtn = overlay.querySelector('.modal-ok');
    function close(){ overlay.remove(); resolve(); }
    okBtn.addEventListener('click', close);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
    setTimeout(()=>okBtn.focus(), 30);
  });
}

function buildGroups(){
  const map = new Map();
  const unlabeledMap = new Map();

  rawRows.forEach(r => {
    if(r.username){
      const key = r.username.toLowerCase();
      if(!map.has(key)) map.set(key, {username:r.username, ipMap:new Map(), firstAddedAt:'', latestAddedAt:''});
      const g = map.get(key);
      g.username = r.username;
      if(r.addedAt){
        if(!g.firstAddedAt || new Date(r.addedAt) < new Date(g.firstAddedAt)) g.firstAddedAt = r.addedAt;
        if(!g.latestAddedAt || new Date(r.addedAt) > new Date(g.latestAddedAt)) g.latestAddedAt = r.addedAt;
      }
      const existing = g.ipMap.get(r.ip);
      if(existing){
        existing.location = r.location;
        existing.isp = r.isp || existing.isp;
        existing.idx = r.idx;
        if(!existing.addedAt || new Date(r.addedAt) > new Date(existing.addedAt)) existing.addedAt = r.addedAt;
        if(!existing.firstAddedAt || new Date(r.addedAt) < new Date(existing.firstAddedAt)) existing.firstAddedAt = r.addedAt;
        existing.ids.push(r.idx);
      } else {
        g.ipMap.set(r.ip, {location:r.location, isp:r.isp||'', idx:r.idx, addedAt:r.addedAt, firstAddedAt:r.addedAt, ids:[r.idx]});
      }
    } else if(r.ip || r.location){
      const key = r.ip + '|' + r.location;
      if(!unlabeledMap.has(key)) unlabeledMap.set(key, {ip:r.ip, location:r.location, isp:r.isp||'', count:0, lastIdx:r.idx, addedAt:'', firstAddedAt:'', ids:[], labelKey:'unlabeled::'+key});
      const u = unlabeledMap.get(key);
      u.count++;
      u.ids.push(r.idx);
      u.lastIdx = Math.max(u.lastIdx, r.idx);
      if(r.isp) u.isp = r.isp;
      if(r.addedAt){
        if(!u.firstAddedAt || new Date(r.addedAt) < new Date(u.firstAddedAt)) u.firstAddedAt = r.addedAt;
        if(!u.addedAt || new Date(r.addedAt) > new Date(u.addedAt)) u.addedAt = r.addedAt;
      }
    }
  });

  users = [...map.values()].map(g => {
    const history = [...g.ipMap.entries()].map(([ip, v]) => ({ip, location:v.location, isp:v.isp||'', idx:v.idx, addedAt:v.addedAt, firstAddedAt:v.firstAddedAt, ids:v.ids}));
    history.sort((a,b) => b.idx - a.idx);
    return {
      username: g.username,
      latestIp: history[0].ip,
      latestLocation: history[0].location,
      latestIsp: history[0].isp,
      latestAddedAt: g.latestAddedAt,
      firstAddedAt: history[0].firstAddedAt,
      history
    };
  });

  unlabeled = [...unlabeledMap.values()].sort((a,b) => b.lastIdx - a.lastIdx);

  ipToUsers = new Map();
  users.forEach(u => {
    u.history.forEach(h => {
      if(!h.ip) return;
      if(!ipToUsers.has(h.ip)) ipToUsers.set(h.ip, new Set());
      ipToUsers.get(h.ip).add(u.username);
    });
  });
}

function sharedIpUsers(ip, excludeUsername){
  const set = ipToUsers.get(ip);
  if(!set || set.size < 2) return [];
  const excludeGk = groupKeyOf(excludeUsername||'');
  return [...set].filter(n => {
    if(n.toLowerCase() === (excludeUsername||'').toLowerCase()) return false;
    if(excludeGk && groupKeyOf(n) === excludeGk) return false; // already linked as the same person
    return true;
  });
}

// ---------- link unlabeled IP to an existing PSN ID (matched by country) ----------
function countryPart(location){
  if(!location) return '';
  const parts = location.split(',');
  return parts[parts.length-1].trim().toLowerCase();
}

function candidatesForCountry(location){
  const country = countryPart(location);
  if(!country) return [];
  return users
    .filter(u => u.history.some(h => countryPart(h.location) === country))
    .map(u => u.username)
    .sort((a,b) => a.localeCompare(b));
}

function matchesQuery(u, q){
  if(!q) return true;
  return u.username.toLowerCase().includes(q);
}

// ---------- linked PSN ID groups (multiple accounts, same person) ----------
function groupKeyOf(username){
  return (labels.get(username.toLowerCase()) || {}).groupKey || '';
}
function membersOfGroupKey(gk){
  if(!gk) return [];
  const keys = [];
  labels.forEach((v, k) => { if(v.groupKey === gk) keys.push(k); });
  return keys;
}
function generateGroupKey(){
  return 'grp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
}

function buildCsvLines(userList, unlabeledList){
  const lines = [['Label','PSN ID','IP','Location','IP History Count','First Seen','Last Seen'].map(csvEscape).join(',')];
  userList.forEach(u=>{
    const labelVal = (labels.get(u.username.toLowerCase()) || {}).label || '';
    const ipVal = isPersonHidden(u.username) ? maskIp(u.latestIp) : u.latestIp;
    lines.push([labelVal, u.username, ipVal, u.latestLocation, u.history.length, u.firstAddedAt||'', u.latestAddedAt||''].map(csvEscape).join(','));
  });
  unlabeledList.forEach(u=>{
    const labelVal = (labels.get(u.labelKey) || {}).label || '';
    const ipVal = ipHidden.get(u.ip) ? maskIp(u.ip) : u.ip;
    lines.push([labelVal, '', ipVal, u.location, u.count, u.firstAddedAt||'', u.addedAt||''].map(csvEscape).join(','));
  });
  return lines;
}

function downloadCsvLines(lines, filenamePrefix){
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  a.href = url;
  a.download = `${filenamePrefix}-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function formatDateYMD(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}/${m}/${day}`;
}

function buildTextExport(userList){

    return `PSN ID: ${u.username}\nIPs:\n${entries.join('\n\n')}`;
  }).join('\n\n\n');
}

}

async function unlinkOne(username){
  if(!isAdmin()) return;
  const key = username.toLowerCase();
  const current = labels.get(key) || {label:'', hidden:false, groupKey:'', favorite:false};
  if(!current.groupKey) return;
  await confirmModal({
    title: `Unlink ${username} from this group?`,
    submitLabel: 'Unlink',
    danger: false,
    onConfirm: async () => {
      labels.set(key, {label:current.label, hidden:current.hidden, groupKey:'', groupPrimary:false, favorite:current.favorite});
      await saveLabelRemote(key, current.label, current.hidden, '', false, current.favorite);
      render();
      showToast(`unlinked ${username}`);
    }
  });
}

async function setGroupPrimary(groupKey, username){
  if(!isAdmin()) return;
  const memberKeys = membersOfGroupKey(groupKey);
  await Promise.all(memberKeys.map(k => {
    const current = labels.get(k) || {label:'', hidden:false, groupKey, groupPrimary:false, favorite:false};
    const isThisOne = (k === username.toLowerCase());
    labels.set(k, {label:current.label, hidden:current.hidden, groupKey:current.groupKey, groupPrimary:isThisOne, favorite:current.favorite});
    return saveLabelRemote(k, current.label, current.hidden, current.groupKey, isThisOne, current.favorite);
  }));
  render();
  showToast(`${username} is now shown on the main row`);
}

// Face of a linked group: whichever member is explicitly marked as primary,
// falling back to whoever was most recently active if nobody's been chosen.
function faceOfGroup(members){
  const primary = members.find(m => (labels.get(m.username.toLowerCase())||{}).groupPrimary);
  if(primary) return primary;
  return [...members].sort((a,b) => new Date(b.latestAddedAt||0) - new Date(a.latestAddedAt||0))[0];
}

// Since every linked account is the same physical person, the group should
// show ONE latest IP overall (whichever account/IP was actually seen most
// recently) rather than the face account's own latest — every other IP,
// across every linked account, is just history for this one person.
function groupLatestRecord(members){
  let best = null;
  members.forEach(m => {
    m.history.forEach(h => {
      if(!best || new Date(h.addedAt||0) > new Date(best.addedAt||0)){
        best = {ip:h.ip, location:h.location, isp:h.isp||'', addedAt:h.addedAt, firstAddedAt:h.firstAddedAt, ids:h.ids, username:m.username};
      }
    });
  });
  return best;
}
