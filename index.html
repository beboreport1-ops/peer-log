async function bulkDeleteSelected(){
  if(!isAdmin()) return;
  const selUsers = getSelectedUserObjs();
  const selUnlabeled = getSelectedUnlabeledObjs();
  const total = selUsers.length + selUnlabeled.length;
  if(!total) return;
  const allIds = [
    ...selUsers.flatMap(u => u.history.flatMap(h => h.ids)),
    ...selUnlabeled.flatMap(u => u.ids)
  ];
  await deleteConfirmModal({
    title: 'Delete selected rows',
    target: `${total} row${total>1?'s':''} · ${allIds.length} record${allIds.length>1?'s':''}`,
    warn: 'The selected rows and every associated history record will be permanently removed. This action cannot be undone.',
    submitLabel: `Delete ${total} row${total>1?'s':''}`,
    onConfirm: async () => {
      await deleteRowsByIds(allIds);
      selected.clear();
      await refreshFromCloud();
      showToast(`deleted ${total} row${total>1?'s':''}`);
    }
  });
}

async function bulkSetHidden(hideFlag){
  if(!isAdmin()) return;
  const selUsers = getSelectedUserObjs();
  const selUnlabeled = getSelectedUnlabeledObjs();
  const total = selUsers.length + selUnlabeled.length;
  if(!total) return;

  if(hideFlag){
    // Players: pick which viewer IDs shouldn't see them. Unlabeled IPs still
    // use the old global per-IP hide (there's no "viewer" identity for those).
    if(selUsers.length){
      await promptHideForViewers(selUsers.map(u => u.username));
    }
    if(selUnlabeled.length){
      await Promise.all(selUnlabeled.map(u => {
        ipHidden.set(u.ip, true);
        return saveIpHiddenRemote(u.ip, true);
      }));
    }
    selected.clear();
    render();
    return;
  }

  // Unhide: clear every per-viewer hide for the selected players, and
  // unhide the selected unlabeled IPs globally like before.
  await confirmModal({
    title: `Unhide ${total} selected row${total>1?'s':''}? Players become visible to every viewer again.`,
    submitLabel: 'Unhide',
    danger: false,
    onConfirm: async () => {
      try{
        await Promise.all([
          ...selUsers.map(u => sbFetch(`peer_hidden_for_viewer?username_key=eq.${encodeURIComponent(u.username.toLowerCase())}`, {method:'DELETE'})),
          ...selUnlabeled.map(u => {
            ipHidden.set(u.ip, false);
            return saveIpHiddenRemote(u.ip, false);
          })
        ]);
        await loadHiddenForViewerData();
        selected.clear();
        render();
        showToast(`unhid ${total} row${total>1?'s':''}`);
      }catch(e){
        console.error(e);
        showToast('unhide failed — check connection', true);
      }
    }
  });
}

function copyToClipboard(text, btnEl){
  const done = () => {
    showToast(`copied ${text}`);
    if(btnEl){
      btnEl.classList.add('copied');
      setTimeout(()=>btnEl.classList.remove('copied'), 900);
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){}
  document.body.removeChild(ta);
}
let toastTimer;
function showToast(msg, isErr){
  toast.textContent = msg;
  toast.classList.toggle('err', !!isErr);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
}

function maskUsername(name){
  if(!name) return name;
  return name.slice(0,2) + '••••';
}
function formatLastSeen(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  const now = new Date();
  const dayMs = 86400000;
  const utcThen = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  const utcNow = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.round((utcNow - utcThen) / dayMs);
  let text;
  if(diffDays <= 0) text = 'today';
  else if(diffDays === 1) text = '1 day';
  else if(diffDays < 30) text = `${diffDays} days`;
  else if(diffDays < 365){
    const m = Math.floor(diffDays/30);
    text = `${m} month${m>1?'s':''}`;
  } else {
    const y = Math.floor(diffDays/365);
    text = `${y} year${y>1?'s':''}`;
  }
  const full = d.toLocaleString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'});
  return `<span title="${escapeHtml(full)}">${escapeHtml(text)}</span>`;
}

// Viewer "last online" — clock time (Saudi Arabia, Asia/Riyadh) for today and
// yesterday, since that's precise and still easy to read; anything older
// just says "N days ago" like everywhere else in the app.
function formatViewerLastSeen(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  const tz = 'Asia/Riyadh';
  const now = new Date();
  const dayFmt = new Intl.DateTimeFormat('en-CA', {timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit'});
  const todayDate = new Date(dayFmt.format(now) + 'T00:00:00Z');
  const dDate = new Date(dayFmt.format(d) + 'T00:00:00Z');
  const diffDays = Math.round((todayDate - dDate) / 86400000);
  const timeStr = new Intl.DateTimeFormat('en-US', {timeZone:tz, hour:'numeric', minute:'2-digit', hour12:true}).format(d).toLowerCase().replace(' ', '');
  let text;
  if(diffDays <= 0) text = timeStr;
  else if(diffDays === 1) text = `yesterday, ${timeStr}`;
  else text = `${diffDays} days ago`;
  const full = d.toLocaleString('en-US', {month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit', timeZone:tz}) + ' (Saudi Arabia time)';
  return `<span title="${escapeHtml(full)}">${escapeHtml(text)}</span>`;
}

function maskIp(ip){
  if(!ip) return ip;
  const parts = ip.split('.');
  if(parts.length === 4){
    return parts.map((p, i) => i===0 ? p : '*'.repeat(p.length)).join('.');
  }
  return '*'.repeat(ip.length);
}

function countryCodeToFlag(code){
  if(!/^[A-Za-z]{2}$/.test(code)) return '';
  const hex = [...code.toUpperCase()].map(c => (127397 + c.charCodeAt(0)).toString(16)).join('-');
  const url = `https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/${hex}.png`;
  return `<img src="${url}" alt="${code.toUpperCase()}" class="flag-icon" style="width:1.2em;height:1.2em;vertical-align:-0.2em;" loading="lazy">`;
}

function locationCell(location){
  if(!location) return '—';
  const parts = location.split(',');
  const last = parts[parts.length-1].trim();

  const flag = code ? countryCodeToFlag(code) : '';
  return flag ? `${flag} ${escapeHtml(location)}` : escapeHtml(location);
}

function renderFavoritesTable(){
  const admin = isAdmin();
  const favUsers = users.filter(u => isFavorite(u.username));
  if(!favUsers.length){ favoritesHolder.innerHTML = ''; return; }

  const byUsernameLower = new Map(users.map(x=>[x.username.toLowerCase(), x]));
  const seenGroups = new Set();
  const items = [];
  favUsers.forEach(u => {
    const gk = groupKeyOf(u.username);
    if(gk){
      if(seenGroups.has(gk)) return;
      const memberKeys = membersOfGroupKey(gk);
      const members = memberKeys.map(k=>byUsernameLower.get(k)).filter(Boolean);
      if(members.length < 2){ items.push({type:'single', user:u}); return; }
      seenGroups.add(gk);
      const face = faceOfGroup(members);
      const latest = groupLatestRecord(members);
      items.push({type:'group', groupKey:gk, face, latest, count:members.length});
    } else {
      items.push({type:'single', user:u});
    }
  });

  items.sort((a,b) => {
    const at = a.type==='group' ? (a.latest?a.latest.addedAt:'') : a.user.latestAddedAt;
    const bt = b.type==='group' ? (b.latest?b.latest.addedAt:'') : b.user.latestAddedAt;
    return new Date(bt||0) - new Date(at||0);
  });

  const rows = items.map(item => {
    if(item.type==='group'){
      const {groupKey, face, latest, count} = item;
      const starBtn = viewerId
        ? `<button class="icon-btn star-btn chip-btn chip-icon chip-accent" data-group-key="${escapeHtml(groupKey)}" title="unpin from favorites">★</button>`
        : `<span class="chip-btn chip-icon chip-accent">★</span>`;
      const ip = latest ? latest.ip : '';
      const hiddenFlag = isPersonHidden(latest ? latest.username : face.username);
      return `
        <tr class="fav-row" data-group-key="${escapeHtml(groupKey)}">
          <td class="checkbox-col">${starBtn}</td>
          <td>${escapeHtml(face.username)}<span class="badge chip-btn chip-accent">+${count-1}</span></td>
          <td>${ipCell(ip, [], {hidden:hiddenFlag, showActions:false})}</td>
          <td class="last-seen">${formatLastSeen(latest?latest.addedAt:'')}</td>
        </tr>`;
    }
    const u = item.user;
    const personHidden = isPersonHidden(u.username);
    const starBtn = viewerId
      ? `<button class="icon-btn star-btn chip-btn chip-icon chip-accent" data-uname="${escapeHtml(u.username)}" title="unpin from favorites">★</button>`
      : `<span class="chip-btn chip-icon chip-accent">★</span>`;
    return `
      <tr class="fav-row" data-key="${escapeHtml(u.username.toLowerCase())}">
        <td class="checkbox-col">${starBtn}</td>
        <td>${escapeHtml(u.username)}</td>
        <td>${ipCell(u.latestIp, [], {hidden:personHidden, showActions:false})}</td>
        <td class="last-seen">${formatLastSeen(u.latestAddedAt)}</td>
      </tr>`;
  }).join('');

  favoritesHolder.innerHTML = `
    <section class="block fav-block">
      <p class="block-title"><span class="fav-star">★</span> Favorites <span class="n">(${items.length})</span></p>
      <table class="fav-table">
        <thead><tr><th class="checkbox-col"></th><th>PSN ID</th><th>Latest IP</th><th>Seen</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </section>`;
  favoritesHolder.querySelectorAll('.star-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(btn.dataset.groupKey) toggleGroupFavorite(btn.dataset.groupKey);
      else toggleFavorite(btn.dataset.uname);
    });
  });
  favoritesHolder.querySelectorAll('.fav-row').forEach(tr=>{
    tr.addEventListener('click', (e)=>{
      if(e.target.closest('.star-btn')) return;
      if(tr.dataset.groupKey){
        openGroupModal(tr.dataset.groupKey);
        return;
      }
      const key = tr.dataset.key;
      expanded.add(key);
      search.value = '';
      render();
      setTimeout(()=>{
        const target = document.querySelector(`.main-row[data-key="${CSS.escape(key)}"]`);
        if(target) target.scrollIntoView({behavior:'smooth', block:'center'});
      }, 50);
    });
  });
}

// Counts distinct player identities — a linked group (multiple PSN IDs,
// same person) counts once, not once per linked account, so this reflects
// how many actual people are tracked rather than how many PSN ID strings.
function countDistinctPlayers(list){
  const seenGroups = new Set();
  let count = 0;
  list.forEach(u => {
    const gk = groupKeyOf(u.username);
    if(gk){
      const members = membersOfGroupKey(gk);
      if(members.length < 2){ count++; return; }
      if(seenGroups.has(gk)) return;
      seenGroups.add(gk);
      count++;
    } else {
      count++;
    }
  });
  return count;
}

function render(){
  const q = search.value.trim().toLowerCase();
  const admin = isAdmin();

  renderFavoritesTable();

  let list = users.filter(u => matchesQuery(u, q));

  // A linked group should sort by whichever member is shown as its "face"
  // (what's actually displayed), not by whichever member's own username
  // happens to be compared — otherwise groups land in the wrong A-Z spot.
  const byUsernameLowerForSort = new Map(users.map(x=>[x.username.toLowerCase(), x]));
  const faceNameCache = new Map(); // groupKey -> face username (lowercase)
  function sortNameFor(u){
    const gk = groupKeyOf(u.username);
    if(!gk) return u.username.toLowerCase();
    if(faceNameCache.has(gk)) return faceNameCache.get(gk);
    const memberKeys = membersOfGroupKey(gk);
    const members = memberKeys.map(k=>byUsernameLowerForSort.get(k)).filter(Boolean);
    const name = (members.length >= 2 ? faceOfGroup(members).username : u.username).toLowerCase();
    faceNameCache.set(gk, name);
    return name;
  }

  list.sort((a,b)=>{
    let va, vb;
    if(sortKey==='ip'){ va=a.latestIp.toLowerCase(); vb=b.latestIp.toLowerCase(); }
    else if(sortKey==='location'){ va=a.latestLocation.toLowerCase(); vb=b.latestLocation.toLowerCase(); }
    else if(sortKey==='lastSeen'){ va=a.latestAddedAt||''; vb=b.latestAddedAt||''; }
    else if(sortKey==='firstSeen'){ va=a.firstAddedAt||''; vb=b.firstAddedAt||''; }
    else { va=sortNameFor(a); vb=sortNameFor(b); }
    if(va<vb) return -1*sortDir;
    if(va>vb) return 1*sortDir;
    return 0;
  });

  countEl.innerHTML = `<b>${countDistinctPlayers(list)}</b>players${q?` (of ${countDistinctPlayers(users)})`:''}`;

  if(!users.length && !unlabeled.length){
    mainHolder.innerHTML = '';
    unlabeledHolder.innerHTML = '';
    return;
  }

  if(!list.length){
    mainHolder.innerHTML = `<div class="empty">No matches for <span class="accent">"${q}"</span></div>`;
  } else {
    const arrow = key => sortKey===key ? `<span class="arrow">${sortDir>0?'▲':'▼'}</span>` : '';
    const th = (key,label) => `<th class="${sortKey===key?'sorted':''}" data-key="${key}" tabindex="0" role="button" aria-label="sort by ${label}">${label}${arrow(key)}</th>`;

    let rowsHtml = '';

    function renderStandaloneRow(u, uIdx){
      const key = u.username.toLowerCase();
      const isExpanded = expanded.has(key);
      const multi = u.history.length > 1;
      const parity = uIdx % 2 === 0 ? 'row-even' : 'row-odd';
      const displayName = escapeHtml(u.username);
      const allHistIds = u.history.flatMap(h=>h.ids);
      const nameEdit = admin
        ? `<button class="icon-btn edit-psn-btn chip-btn" data-ids="${allHistIds.join(',')}" data-uname="${escapeHtml(u.username)}" title="edit PSN ID">Edit</button>`
        : '';
      const addIpBtn = admin
        ? `<button class="icon-btn add-ip-btn chip-btn chip-ghost" data-uname="${escapeHtml(u.username)}" title="add an IP for ${escapeHtml(u.username)}">+ IP</button>`
        : '';
      const addPsnLinkBtn = admin
        ? `<button class="icon-btn add-psn-link-btn chip-btn chip-ghost" data-uname="${escapeHtml(u.username)}" title="link another PSN ID as the same person">+ Add PSN ID</button>`
        : '';
      const nameCopyBtn = u.username ? `<button class="icon-btn copy-btn chip-btn chip-icon" data-copy="${escapeHtml(u.username)}" title="copy PSN ID" aria-label="copy PSN ID">⧉</button>` : '';
      const fav = isFavorite(u.username);
      const starBtnInline = viewerId
        ? `<button class="icon-btn star-btn star-btn-inline chip-btn chip-icon ${fav?'chip-accent':''}" data-uname="${escapeHtml(u.username)}" title="${fav?'unpin':'pin to favorites'}">${fav?'★':'☆'}</button>`
        : (fav ? `<span class="chip-btn chip-icon chip-accent star-btn-inline">★</span>` : '');
      const starBtnCol = viewerId
        ? `<button class="icon-btn star-btn star-btn-col chip-btn chip-icon ${fav?'chip-accent':''}" data-uname="${escapeHtml(u.username)}" title="${fav?'unpin':'pin to favorites'}">${fav?'★':'☆'}</button>`
        : (fav ? `<span class="chip-btn chip-icon chip-accent star-btn-col">★</span>` : '');
      const uSelKey = userSelKey(u);
      const rowChecked = selected.has(uSelKey) ? 'checked' : '';
      const personHidden = isPersonHidden(u.username);
      const rowHideBtn = personHideBtn(u.username);
      const rowDelBtn = ipDelBtn(u.latestIp, u.history[0].ids);
      const actionGroupContent = `${nameEdit}${addIpBtn}${addPsnLinkBtn}${rowHideBtn}${rowDelBtn}`;
      const actionGroup = (isExpanded && actionGroupContent) ? `<span class="uname-actions">${actionGroupContent}</span>` : '';
      let out = `
        <tr class="main-row has-psn ${parity} ${isExpanded?'expanded':''}" data-key="${escapeHtml(key)}">
          <td class="checkbox-col"><input type="checkbox" class="row-check" data-sel-key="${escapeHtml(uSelKey)}" ${rowChecked}>${starBtnCol}</td>
          <td><span class="row-name-wrap"><span class="caret">${(multi||admin)?'▸':''}</span><span class="row-name-text">${displayName}</span></span>${starBtnInline}${nameCopyBtn}${actionGroup}</td>
          <td>${ipCell(u.latestIp, u.history[0].ids, {hidden: personHidden, showActions:false, sharedWith:sharedIpUsers(u.latestIp, u.username)})}</td>
          <td>${locationCell(u.latestLocation)}
            ${multi?`<span class="badge chip-btn chip-accent" data-key="${escapeHtml(key)}">+${u.history.length-1} more</span>`:''}
          </td>
          <td class="isp-col">${u.latestIsp ? escapeHtml(u.latestIsp) : '—'}</td>
          <td class="last-seen">${formatLastSeen(u.firstAddedAt)}</td>
          <td class="last-seen">${formatLastSeen(u.latestAddedAt)}</td>
        </tr>`;
      if(isExpanded){
        u.history.forEach((h, i) => {
          out += `
            <tr class="hist-row ${parity} ${i===0?'newest':''}" style="animation-delay:${Math.min(i*35,250)}ms">
              <td></td>
              <td></td>
              <td>${ipCell(h.ip, h.ids, {hidden: personHidden, showEye:false, sharedWith:sharedIpUsers(h.ip, u.username)})}</td>
              <td>${locationCell(h.location)}${i===0?'<span class="hist-tag">latest</span>':''}</td>
              <td class="isp-col">${h.isp ? escapeHtml(h.isp) : '—'}</td>
              <td class="last-seen">${formatLastSeen(h.firstAddedAt)}</td>
              <td class="last-seen">${formatLastSeen(h.addedAt)}</td>
            </tr>`;
        });
      }
      return out;
    }

    function renderGroupHeaderRow(groupKey, members, uIdx){
      const parity = uIdx % 2 === 0 ? 'row-even' : 'row-odd';
      const face = faceOfGroup(members);
      const latest = groupLatestRecord(members);
      const firstSeen = latest ? latest.firstAddedAt : '';
      const gSelKey = 'g::'+groupKey;
      const rowChecked = selected.has(gSelKey) ? 'checked' : '';
      const fav = isGroupFavorite(members);
      const starBtnInline = viewerId
        ? `<button class="icon-btn star-btn star-btn-inline chip-btn chip-icon ${fav?'chip-accent':''}" data-group-key="${escapeHtml(groupKey)}" title="${fav?'unpin':'pin to favorites'}">${fav?'★':'☆'}</button>`
        : (fav ? `<span class="chip-btn chip-icon chip-accent star-btn-inline">★</span>` : '');
      const starBtnCol = viewerId
        ? `<button class="icon-btn star-btn star-btn-col chip-btn chip-icon ${fav?'chip-accent':''}" data-group-key="${escapeHtml(groupKey)}" title="${fav?'unpin':'pin to favorites'}">${fav?'★':'☆'}</button>`
        : (fav ? `<span class="chip-btn chip-icon chip-accent star-btn-col">★</span>` : '');
      return `
        <tr class="main-row has-psn group-header ${parity}" data-group-key="${escapeHtml(groupKey)}">
          <td class="checkbox-col"><input type="checkbox" class="row-check" data-sel-key="${escapeHtml(gSelKey)}" ${rowChecked}>${starBtnCol}</td>
          <td><span class="row-name-wrap"><span class="caret">▸</span><span class="row-name-text">${escapeHtml(face.username)}</span></span>${starBtnInline}<span class="badge chip-btn chip-accent group-badge" data-group-key="${escapeHtml(groupKey)}" title="${members.length-1} more linked account${members.length-1>1?'s':''}">+${members.length-1}</span></td>
          <td>${ipCell(latest.ip, [], {hidden: isPersonHidden(latest.username), showActions:false, sharedWith:sharedIpUsers(latest.ip, face.username)})}</td>
          <td>${locationCell(latest.location)}</td>
          <td class="isp-col">${latest.isp ? escapeHtml(latest.isp) : '—'}</td>
          <td class="last-seen">${formatLastSeen(firstSeen)}</td>
          <td class="last-seen">${formatLastSeen(latest.addedAt)}</td>
        </tr>`;
    }

    const seenGroups = new Set();
    const renderedSelKeys = [];
    const byUsernameLower = new Map(users.map(x=>[x.username.toLowerCase(), x]));
    list.forEach((u, uIdx) => {
      const gk = groupKeyOf(u.username);
      if(gk){
        if(seenGroups.has(gk)) return;
        const memberKeys = membersOfGroupKey(gk);
        const members = memberKeys.map(k=>byUsernameLower.get(k)).filter(Boolean);
        if(members.length < 2){
          rowsHtml += renderStandaloneRow(u, uIdx);
          renderedSelKeys.push(userSelKey(u));
          return;
        }
        seenGroups.add(gk);
        members.sort((a,b) => new Date(b.latestAddedAt||0) - new Date(a.latestAddedAt||0));
        rowsHtml += renderGroupHeaderRow(gk, members, uIdx);
        renderedSelKeys.push('g::'+gk);
      } else {
        rowsHtml += renderStandaloneRow(u, uIdx);
        renderedSelKeys.push(userSelKey(u));
      }
    });

    const allUserSelKeys = renderedSelKeys;
    const allUsersChecked = allUserSelKeys.length>0 && allUserSelKeys.every(k=>selected.has(k));
    const someUsersChecked = allUserSelKeys.some(k=>selected.has(k));
    const usersIndeterminate = someUsersChecked && !allUsersChecked;

    mainHolder.innerHTML = `
      <table class="main-table">
        <thead><tr>
          <th class="checkbox-col"><input type="checkbox" id="selectAllUsers" class="row-check" ${allUsersChecked?'checked':''}></th>

          ${th('location','Latest Location')}

          ${th('firstSeen','First Seen')}
          ${th('lastSeen','Seen')}
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>

    const selectAllUsersEl = document.getElementById('selectAllUsers');
    if(selectAllUsersEl) selectAllUsersEl.indeterminate = usersIndeterminate;

    selectAllUsersEl.addEventListener('click', e=>{
      e.stopPropagation();
      if(e.target.checked) allUserSelKeys.forEach(k=>selected.add(k));
      else allUserSelKeys.forEach(k=>selected.delete(k));
      render();
    });

    mainHolder.querySelectorAll('.row-check').forEach(cb=>{
      cb.addEventListener('click', e => e.stopPropagation());
      cb.addEventListener('change', e=>{
        const k = cb.dataset.selKey;
        if(cb.checked) selected.add(k); else selected.delete(k);
        renderBulkBar();
        const sa = document.getElementById('selectAllUsers');
        if(sa){
          sa.checked = allUserSelKeys.every(kk=>selected.has(kk));
          sa.indeterminate = allUserSelKeys.some(kk=>selected.has(kk)) && !sa.checked;
        }
      });
    });

    mainHolder.querySelectorAll('thead th').forEach(th=>{
      const doSort = ()=>{
        const key = th.dataset.key;
        if(!key) return;
        if(sortKey === key) sortDir *= -1;
        else { sortKey = key; sortDir = 1; }
        render();
      };
      th.addEventListener('click', doSort);
      th.addEventListener('keydown', e=>{
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          doSort();
        }
      });
    });

    mainHolder.querySelectorAll('.main-row').forEach(tr=>{
      tr.addEventListener('click', (e)=>{
        if(e.target.closest('.badge') || e.target.closest('.icon-btn') || e.target.closest('.label-input') || e.target.closest('.row-check')) return;
        if(tr.dataset.groupKey){
          openGroupModal(tr.dataset.groupKey);
          return;
        }
        const key = tr.dataset.key;
        if(!key) return;
        if(isMobileView()){
          const u = users.find(x => x.username.toLowerCase() === key);
          if(u) openPlayerModal(u.username);
          return;
        }
        if(expanded.has(key)) expanded.delete(key);
        else expanded.add(key);
        render();
      });
    });
    mainHolder.querySelectorAll('.badge').forEach(b=>{
      b.addEventListener('click', (e)=>{
        e.stopPropagation();
        if(b.dataset.groupKey){
          openGroupModal(b.dataset.groupKey);
          return;
        }
        const key = b.dataset.key;
        if(expanded.has(key)) expanded.delete(key);
        else expanded.add(key);
        render();
      });
    });
  }

  const filteredUnlabeled = admin ? unlabeled.filter(u => !q) : [];

  if(!filteredUnlabeled.length){
    unlabeledHolder.innerHTML = '';
  } else {
    const allUnlabeledSelKeys = filteredUnlabeled.map(unlabeledSelKey);
    const allUnlabeledChecked = allUnlabeledSelKeys.length>0 && allUnlabeledSelKeys.every(k=>selected.has(k));
    const someUnlabeledChecked = allUnlabeledSelKeys.some(k=>selected.has(k));
    const unlabeledIndeterminate = someUnlabeledChecked && !allUnlabeledChecked;

    unlabeledHolder.innerHTML = `
      <section class="block">
        <p class="block-title"><span class="warn">⚠</span> No PSN ID <span class="n">(${filteredUnlabeled.length})</span></p>
        <table class="unlabeled-table">
          <thead><tr>
            <th class="checkbox-col"><input type="checkbox" id="selectAllUnlabeled" class="row-check" ${allUnlabeledChecked?'checked':''}></th>
            <th>Label</th><th>IP Address</th><th>Location</th><th>ISP</th><th>Times Seen</th><th>First Seen</th><th>Seen</th>
          </tr></thead>
          <tbody>
            ${filteredUnlabeled.map(u=>{
              const labelInfo = labels.get(u.labelKey) || {label:'', hidden:false};
              const rowHidden = ipHidden.get(u.ip)||false;
              const isRevealed = revealedUnlabeled.has(u.labelKey);
              const addPsnBtn = admin ? `<button class="add-psn-btn chip-btn chip-ghost" data-ids="${u.ids.join(',')}" data-ip="${escapeHtml(u.ip)}" title="assign a PSN ID to this IP">+ add PSN ID</button>` : '';
              const rowHideBtn = ipHideBtn(u.ip, rowHidden);
              const rowDelBtn = ipDelBtn(u.ip, u.ids);
              const unlabeledActionContent = `${addPsnBtn}${rowHideBtn}${rowDelBtn}`;
              const labelCell = admin
                ? `<input class="label-input" data-key="${escapeHtml(u.labelKey)}" value="${escapeHtml(labelInfo.label)}" placeholder="+ label">${(isRevealed && unlabeledActionContent)?`<span class="uname-actions">${unlabeledActionContent}</span>`:''}`
                : `<span class="label-static">${escapeHtml(labelInfo.label)||'—'}</span>`;
              const uSelKey = unlabeledSelKey(u);
              const rowChecked = selected.has(uSelKey) ? 'checked' : '';
              return `
              <tr class="${admin?'unlabeled-row':''} ${isRevealed?'expanded':''}" data-ids="${u.ids.join(',')}" data-ip="${escapeHtml(u.ip)}" data-location="${escapeHtml(u.location)}" data-label-key="${escapeHtml(u.labelKey)}">
                <td class="checkbox-col"><input type="checkbox" class="row-check unlabeled-check" data-sel-key="${escapeHtml(uSelKey)}" ${rowChecked}></td>
                <td>${labelCell}</td>
                <td>${ipCell(u.ip, u.ids, {hidden: rowHidden, showActions:false, sharedWith:sharedIpUsers(u.ip, '')})}</td>
                <td>${locationCell(u.location)}</td>
                <td class="isp-col">${u.isp ? escapeHtml(u.isp) : '—'}</td>
                <td>${u.count}</td>
                <td class="last-seen">${formatLastSeen(u.firstAddedAt)}</td>
                <td class="last-seen">${formatLastSeen(u.addedAt)}</td>
              </tr>
            `;}).join('')}
          </tbody>
        </table>
      </section>
    `;

    const selectAllUnlabeledEl = document.getElementById('selectAllUnlabeled');
    if(selectAllUnlabeledEl) selectAllUnlabeledEl.indeterminate = unlabeledIndeterminate;

    selectAllUnlabeledEl.addEventListener('click', e=>{
      e.stopPropagation();
      if(e.target.checked) allUnlabeledSelKeys.forEach(k=>selected.add(k));
      else allUnlabeledSelKeys.forEach(k=>selected.delete(k));
      render();
    });

    unlabeledHolder.querySelectorAll('.unlabeled-check').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const k = cb.dataset.selKey;
        if(cb.checked) selected.add(k); else selected.delete(k);
        renderBulkBar();
        const sa = document.getElementById('selectAllUnlabeled');
        if(sa){
          sa.checked = allUnlabeledSelKeys.every(kk=>selected.has(kk));
          sa.indeterminate = allUnlabeledSelKeys.some(kk=>selected.has(kk)) && !sa.checked;
        }
      });
    });

    if(admin){
      const openAddPsn = (tr) => {
        const ids = tr.dataset.ids.split(',').filter(Boolean).map(Number);
        promptLinkOrAddUsername({
          ids,
          location: tr.dataset.location,
          ip: tr.dataset.ip
        });
      };
      unlabeledHolder.querySelectorAll('.add-psn-btn').forEach(btn=>{
        btn.addEventListener('click', e=>{
          e.stopPropagation();
          openAddPsn(btn.closest('tr'));
        });
      });
      unlabeledHolder.querySelectorAll('.unlabeled-row').forEach(tr=>{
        tr.addEventListener('click', e=>{
          if(e.target.closest('.icon-btn') || e.target.closest('.label-input') || e.target.closest('.row-check') || e.target.closest('.add-psn-btn')) return;
          const lk = tr.dataset.labelKey;
          if(isMobileView()){
            openUnlabeledModal(lk);
            return;
          }
          if(revealedUnlabeled.has(lk)) revealedUnlabeled.delete(lk);
          else revealedUnlabeled.add(lk);
          render();
        });
      });
    }
  }

  renderBulkBar();

  if(admin){
    document.querySelectorAll('.label-input').forEach(inp=>{
      inp.addEventListener('click', e => e.stopPropagation());
      let lastSaved = inp.value;
      inp.addEventListener('keydown', e=>{ if(e.key === 'Enter') inp.blur(); });
      inp.addEventListener('blur', ()=>{
        const val = inp.value.trim();
        if(val !== lastSaved){
          lastSaved = val;
          saveLabel(inp.dataset.key, val);
        }
      });
    });
  }

  document.querySelectorAll('.copy-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      copyToClipboard(btn.dataset.copy, btn);
    });
  });
  document.querySelectorAll('.star-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(btn.dataset.groupKey){
        toggleGroupFavorite(btn.dataset.groupKey);
      } else {
        toggleFavorite(btn.dataset.uname);
      }
    });
  });
  if(admin){
    document.querySelectorAll('.del-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const ids = btn.dataset.ids.split(',').filter(Boolean).map(Number);
        promptDeleteIp(ids, btn.dataset.ip);
      });
    });
    document.querySelectorAll('.eye-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        promptToggleIpHidden(btn.dataset.ip);
      });
    });
    document.querySelectorAll('.edit-psn-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const ids = btn.dataset.ids.split(',').filter(Boolean).map(Number);
        promptAssignUsername({
          ids,
          currentUsername: btn.dataset.uname,
          title: `Edit PSN ID for ${btn.dataset.uname}`,
          submitLabel: 'Save'
        });
      });
    });
    document.querySelectorAll('.add-ip-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        promptAddIpToUser(btn.dataset.uname);
      });
    });
    document.querySelectorAll('.add-psn-link-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        promptAddPsnIdLink(btn.dataset.uname);
      });
    });
    document.querySelectorAll('.person-hide-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        promptHideForViewers(btn.dataset.uname);
      });
    });
  }
}

function csvEscape(v){
  v = (v==null?'':String(v));
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}

function exportFilteredCSV(){
  const q = search.value.trim().toLowerCase();
  const list = users.filter(u => matchesQuery(u, q));
  const filteredUnlabeled = isAdmin() ? unlabeled.filter(u => !q) : [];

  if(!list.length && !filteredUnlabeled.length){
    showToast('nothing to export');
    return;
  }

  downloadCsvLines(buildCsvLines(list, filteredUnlabeled), 'peer-log-filtered');
  showToast('exported CSV');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

search.addEventListener('input', render);
exportBtn.addEventListener('click', exportFilteredCSV);
manageViewersBtn.addEventListener('click', openManageViewerIds);
recheckLocationsBtn.addEventListener('click', recheckAllLocations);
backupBtn.addEventListener('click', backupDatabase);
restoreBtn.addEventListener('click', () => restoreFileInput.click());
restoreFileInput.addEventListener('change', e => {
  if(e.target.files.length) restoreDatabaseFromFile(e.target.files[0]);
  restoreFileInput.value = '';
});

init();
</script>
</body>
</html>
